- id: s8-p01
  name: "FORGE CLI"
  description: |
    Create src/cli/index.ts as the main entry point using commander:
    
    Commands:
    - `forge build <path> [--idea "text"] [--prd path] [--autonomous-recovery] [--dry-run]`
      Full build pipeline: Phase 0 → 1 → 2 → 3 → 4 → 5
    - `forge scout <path>` — Run Phase 0 only
    - `forge design <path> --idea "text"` — Run Phase 0 + 1 only (PRD + Architecture)
    - `forge resume <build-id>` — Resume a halted build from last checkpoint
    - `forge replay <build-id> --from <prompt-index>` — Replay from checkpoint
    - `forge status [build-id]` — Show build status from Build Memory
    - `forge history [--project name]` — List past builds
    - `forge patterns` — Show known error patterns and success rates
    - `forge agents` — List self-created agents and their status
    - `forge resurrect <path>` — Run Project Autopsy on failed project
    - `forge estimate <path> --idea "text"` — Cost/time estimate without building
    
    Use chalk for colored output, ora for spinners during long operations.
    Create src/cli/config.ts for loading .env and configuration.
    Add `"bin": { "forge": "./dist/cli/index.js" }` to package.json.
    Add build script: `"build": "tsc"` and `"forge": "node dist/cli/index.js"`.
    Update STATE_OF_THE_BUILD.md and SESSION_STATE.md from actual codebase audit.

- id: s8-p02
  name: "Post-Deploy Monitoring Agent"
  description: |
    Create src/monitoring/deploy-agent.ts:
    Generates a lightweight monitoring snippet that gets injected into built applications.
    The snippet:
    1. Catches unhandled errors and reports: error message, stack trace, URL, timestamp
    2. Measures page load time and reports if > 3s
    3. Reports API call failures (non-2xx responses)
    4. Sends telemetry to a configurable endpoint (FORGE telemetry receiver)
    
    Create src/monitoring/telemetry-receiver.ts:
    An Express-compatible route handler that:
    1. Receives telemetry POST requests from deployed apps
    2. Validates payload structure
    3. Writes to production_telemetry table in Build Memory
    4. For critical errors: logs to console with project name
    
    The receiver can run as a simple Node.js server alongside FORGE,
    or be deployed as a Vercel serverless function.
    Update STATE_OF_THE_BUILD.md and SESSION_STATE.md from actual codebase audit.

