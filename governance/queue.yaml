# SPRINT 6: Phase 5 — Recursive Learner (Est. 3-4 hours)
# ============================================================

- id: s6-p01
  name: "Pattern Extractor"
  description: |
    Create src/analysis/pattern-extractor.ts:
    After a build completes, analyze all prompt_executions for patterns:
    
    Error Patterns:
    - Group errors by normalized signature (strip paths, lines, timestamps)
    - Calculate occurrence rate per stack fingerprint
    - Identify trigger conditions (prompt type, prompt index range)
    
    Timing Patterns:
    - Average execution time per prompt_type
    - Variance and outliers
    - Correlation between prompt complexity and time
    
    Success Patterns:
    - Prompt structures with highest success rates
    - Governance sections that correlated with fewer errors
    - Rewrite patterns that improved outcomes
    
    Cost Patterns:
    - Average token cost per prompt_type
    - Total build cost by project complexity (table count, feature count)
    
    Output: ExtractedPatterns with error_patterns[], timing_patterns[],
    success_patterns[], cost_patterns[].
    Store all patterns in Build Memory.
    Update STATE_OF_THE_BUILD.md and SESSION_STATE.md from actual codebase audit.

- id: s6-p02
  name: "Template Evolver"
  description: |
    Create src/analysis/template-evolver.ts:
    Analyzes Build Memory across all completed builds to propose governance improvements:
    1. Load all governance_versions with effectiveness_scores
    2. Identify templates/sections with declining effectiveness
    3. Identify templates/sections never referenced by build agents
    4. Correlate template versions with build success rates
    5. Generate proposed changes with:
       - Exact text diff (old → new)
       - Evidence (which builds, what metrics)
       - Expected improvement
    6. Store proposals as governance_versions with change_source = 'recursive_learner'
    
    Create src/analysis/cost-estimator.ts:
    Given a stack fingerprint and feature list, predict:
    - Total prompts needed
    - Total tokens (based on Build Memory averages per prompt_type)
    - Total dollar cost
    - Total execution time
    - Predicted failure count (based on error pattern frequency)
    Output: BuildEstimate with all predictions and confidence intervals.
    Update STATE_OF_THE_BUILD.md and SESSION_STATE.md from actual codebase audit.

- id: s6-p03
  name: "Agent Creator"
  description: |
    Create src/analysis/agent-creator.ts:
    Identifies recurring task patterns and creates new agents:
    1. Analyze prompt_executions across builds for repeated multi-step sequences
    2. If a 2+ step sequence appears in 3+ builds with no dedicated handler:
       a. Design agent spec: name, purpose, triggers, I/O contracts
       b. Generate TypeScript implementation using Claude API
       c. Test against historical data (replay the pattern with the new agent)
       d. Store as self_created_agent with status 'proposed'
    3. Generate human-readable proposal document with:
       - Agent name and purpose
       - Implementation code
       - Test results
       - Projected impact on future builds
    
    Create src/phases/phase5-learner.ts:
    Orchestrates the full Phase 5 sequence:
    1. Run pattern-extractor on the completed build
    2. Run template-evolver to check for governance improvements
    3. Run agent-creator to check for new agent opportunities
    4. Generate cross_project_insights for applicable stack fingerprints
    5. Produce Phase 5 summary report
    Update STATE_OF_THE_BUILD.md and SESSION_STATE.md from actual codebase audit.

# ============================================================
# SPRINT 7: Advanced Capabilities (Est. 2-3 hours)
# ============================================================

- id: s7-p01
  name: "Six Laws Automated Verifier"
  description: |
    Create src/analysis/six-laws-verifier.ts:
    Automated verification of 5 of 6 Laws after build completion:
    
    Law 1 - SCHEMA: Connect to Supabase, query information_schema.
    Verify every table in SCHEMA_REGISTRY.md exists with correct columns and types.
    Verify RLS policies exist on every table.
    
    Law 2 - API: For every route in BEHAVIORAL_CONTRACTS.md, send an HTTP request
    and verify response status code and shape matches contract.
    
    Law 3 - UI: Use Playwright to visit every page route. Check for:
    - No "coming soon", "placeholder", "TODO", "lorem ipsum" text
    - All specified interactive elements exist (buttons, forms, dropdowns)
    - Pages render without console errors
    
    Law 4 - DATA: During Playwright page visits, intercept network requests.
    Verify real API calls are made (not hardcoded data, no mock responses).
    
    Law 5 - WIRING: Playwright tests:
    - Every nav link navigates correctly
    - Form submissions trigger correct API calls
    - Role-based access restricts unauthorized routes
    
    Output: SixLawsResult with per-law pass/fail + details.
    Update STATE_OF_THE_BUILD.md and SESSION_STATE.md from actual codebase audit.

- id: s7-p02
  name: "Build Replay and Dry Run"
  description: |
    Create replay logic in src/phases/phase3-executor.ts:
    Add `replay` mode that:
    1. Takes a build_run_id and a starting checkpoint tag
    2. Rolls back to that checkpoint
    3. Reloads governance (may have been modified)
    4. Re-executes queue from that prompt index forward
    5. Treats it as a new build_run linked to the original
    
    Create dry-run logic:
    Add `dryRun` mode that:
    1. Runs Phase 0 (real environment check)
    2. Runs Phase 1 (real design generation)
    3. Runs Phase 2 (real governance generation)
    4. For Phase 3: assembles every prompt but does NOT execute
    5. Runs failure-predictor on every prompt
    6. Runs cost-estimator for the full build
    7. Produces simulation report: predicted prompts, predicted errors,
       predicted cost, predicted time
    8. No tokens consumed for build execution
    Update STATE_OF_THE_BUILD.md and SESSION_STATE.md from actual codebase audit.

- id: s7-p03
  name: "Project Autopsy + Resurrection"
  description: |
    Create src/tools/project-autopsy.ts:
    Given a failed/abandoned project path:
    1. Run codebase-reader to catalog everything
    2. Run schema-extractor to get DB state
    3. Analyze code quality: count TODO/FIXME/placeholder text, empty functions,
       mock data, commented-out code, unused imports
    4. Classify files: keep (quality code), refactor (concept ok, impl bad), discard (broken)
    5. Extract architectural intent from file structure, naming, existing docs
    6. Diagnose failure: missing features, broken integrations, incomplete implementations
    7. Produce AutopsyReport: { intent, diagnosis, salvageAssessment, reconstructionInputs }
    
    Integration with Phase 1A: when Phase 1A receives an AutopsyReport as input
    instead of raw idea text, it generates a PRD that preserves salvageable elements
    and redesigns the rest. This feeds normally into Phase 1B → 2 → 3.
    Update STATE_OF_THE_BUILD.md and SESSION_STATE.md from actual codebase audit.

