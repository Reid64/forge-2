    Create docker/docker-compose.yml for self-hosted Supabase. Include services:
    postgres (v15), postgrest, gotrue, storage, realtime, kong, supabase-studio.
    Use the official Supabase self-hosting docker-compose as reference.
    Generate secure default passwords and JWT secrets.
    Create a PowerShell script docker/start-forge-db.ps1 that:
    1. Checks if Docker Desktop is running, starts it if not
    2. Runs docker compose up -d from the docker/ directory
    3. Waits for health check on localhost:54321
