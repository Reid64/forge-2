- id: s1-p01
  name: "Project Initialization"
  description: |
    Initialize the FORGE 2.0 project. Create the project directory, initialize pnpm,
    install core dependencies (typescript, @supabase/supabase-js, js-yaml, commander, 
    chalk, ora, glob, playwright), configure tsconfig.json with strict mode (NO baseUrl),
    create the complete directory structure from BLUEPRINT.md, create .env.example,
    create .gitignore, initialize git repo. Do NOT use baseUrl in tsconfig.
    Create src/types/index.ts with all TypeScript interfaces for: BuildRun, PromptExecution,
    ErrorPattern, Resolution, GovernanceVersion, SelfCreatedAgent, CrossProjectInsight,
    ProductionTelemetry, StackProfile, DesignPattern, BrandIdentity.
    Every interface must match the SCHEMA_REGISTRY.md exactly.
    Update STATE_OF_THE_BUILD.md and SESSION_STATE.md from actual codebase audit.

