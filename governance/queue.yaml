# ============================================================
# SPRINT 2: Phase 0 — Toolchain Scout (Est. 2-3 hours)
# ============================================================

- id: s2-p01
  name: "Stack Detector"
  description: |
    Create src/tools/stack-detector.ts.
    Given a project path, detect the technology stack by reading:
    - package.json (framework, dependencies)
    - tsconfig.json (TypeScript config)
    - next.config.* (Next.js)
    - vercel.json (Vercel deployment)
    - .env* files (service integrations: Supabase, Stripe, Claude, etc.)
    - docker-compose.yml (Docker services)
    - Any existing BLUEPRINT.md or PRD.md
    Output a StackFingerprint object: { framework, language, database, deployment,
    packageManager, services[], cliTools[] }.
    Handle missing files gracefully — partial detection is valid.
    Update STATE_OF_THE_BUILD.md and SESSION_STATE.md from actual codebase audit.

- id: s2-p02
  name: "Environment Auditor"
  description: |
    Create src/tools/env-auditor.ts.
    Given a StackFingerprint, determine required environment variables and CLI tools.
    Check which are present and which are missing.
    For CLI tools: check pnpm, node, git, vercel, claude, playwright, supabase, docker
    using `where.exe` or `Get-Command` in PowerShell.
    For env vars: check .env files and process.env for required keys (masked values in output).
    For Docker: check if Docker Desktop is running, if FORGE Supabase is up.
    Output an EnvironmentAudit: { present[], missing[], warnings[], dockerStatus }.
    Update STATE_OF_THE_BUILD.md and SESSION_STATE.md from actual codebase audit.

- id: s2-p03
  name: "Phase 0 Scout Orchestrator"
  description: |
    Create src/phases/phase0-scout.ts.
    Orchestrates the full Phase 0 sequence:
    1. Run stack-detector on target project path
    2. Run env-auditor with detected stack
    3. Query Build Memory for cached configs on this machine
    4. Attempt auto-install for missing tools (pnpm install -g for npm tools)
    5. Attempt auto-fix for known issues (PATH fix, execution policy)
    6. Generate TOOLCHAIN.md content with locked versions, skill manifest, env checklist
    7. Register machine_id in Build Memory if not already registered
    8. Return Phase0Result: { stackFingerprint, environmentAudit, toolchainManifest, 
       passed: boolean, blockers[] }
    If blockers exist (critical missing tools), passed = false and FORGE halts.
    Write TOOLCHAIN.md to target project governance directory.
    Update STATE_OF_THE_BUILD.md and SESSION_STATE.md from actual codebase audit.

# ============================================================
# SPRINT 3: Phase 1 — Intelligence Engine (Est. 4-6 hours)
# ============================================================

- id: s3-p01
  name: "Codebase Reader"
  description: |
    Create src/tools/codebase-reader.ts.
    Given a project path, read and catalog the entire codebase:
    - File tree (excluding node_modules, .git, .next)
    - For each .ts/.tsx/.js/.jsx file: extract exports, component names, function signatures
    - For each migration file: extract table names and columns
    - package.json dependencies
    - Route structure (pages/ or app/ directory for Next.js)
    - Existing governance documents (if any)
    Output a CodebaseSnapshot: { fileTree, components[], routes[], schema[], 
    dependencies[], governanceDocs[], stats: { totalFiles, totalLines } }.
    This is used by Phase 1C for partial build ingestion.
    Update STATE_OF_THE_BUILD.md and SESSION_STATE.md from actual codebase audit.

- id: s3-p02
  name: "Schema Extractor"
  description: |
    Create src/tools/schema-extractor.ts.
    Given a project path or Supabase connection, extract the current database schema:
    - From migration SQL files: parse CREATE TABLE, ALTER TABLE, CREATE INDEX
    - From live Supabase (if connected): query information_schema.tables, columns, 
      constraints, pg_indexes
    - Extract RLS policies from pg_policies
    Output a SchemaSnapshot: { tables[], relationships[], indexes[], rlsPolicies[] }.
    Each table includes: name, columns (name, type, nullable, default, constraints),
    primary key, foreign keys.
    Update STATE_OF_THE_BUILD.md and SESSION_STATE.md from actual codebase audit.

- id: s3-p03
  name: "Phase 1C: Current State Ingestion"
  description: |
    Create src/phases/phase1c-ingest.ts.
    For partial builds, produces a ConstraintManifest:
    1. Run codebase-reader on the project
    2. Run schema-extractor on the project
    3. Classify each component: immutable (keep), extensible (can add to), flagged (anti-pattern)
    4. Generate constraint manifest with:
       - Existing schema tables (immutable)
       - Existing routes (immutable)
       - Existing components (immutable)
       - Existing design tokens (immutable)
       - Available extension points (where new code can be added)
       - Flagged patterns (potential issues for human review)
    Output ConstraintManifest type with all classifications.
    Update STATE_OF_THE_BUILD.md and SESSION_STATE.md from actual codebase audit.

- id: s3-p04
  name: "PRD Generator (Phase 1A)"
  description: |
    Create src/phases/phase1a-prd.ts.
    Takes raw idea input (string) and produces a complete PRD.
    Uses Claude API (claude-sonnet-4-6-20250514) with a structured system prompt that:
    1. Parses the idea for core concept, target users, key features, business model
    2. Queries Build Memory for similar projects (by stack fingerprint similarity)
    3. Decomposes features into granular capabilities with user actions, system actions,
       data changes, and feedback
    4. Generates edge cases for every feature
    5. Assembles structured PRD with: executive summary, user personas, feature specs
       (with interaction-level detail), data model overview, integration requirements,
       success metrics, scope boundaries
    Uses Build Memory patterns to fill gaps with proven defaults.
    Output: { prd: string (markdown), metadata: { featureCount, tableEstimate, agentEstimate } }.
    PRD is written to target project as PRD.md.
    Build halts after this for Gate 1 human approval.
    Update STATE_OF_THE_BUILD.md and SESSION_STATE.md from actual codebase audit.

- id: s3-p05
  name: "Architecture Engine (Phase 1B)"
  description: |
    Create src/phases/phase1b-architect.ts.
    Takes approved PRD + optional ConstraintManifest and produces complete design artifacts.
    Uses Claude API with specialized system prompts for each artifact type.
    Must handle context window limits by chunking: generate each artifact in a separate
    Claude call with a state summary from previous calls.
    Generates ALL of the following (each as a structured object + markdown):
    1. DatabaseArchitecture: tables, columns, types, constraints, RLS, indexes, seeds, migrations
    2. APIArchitecture: routes, methods, request/response schemas, auth requirements, errors
    3. FrontendArchitecture: pages, components, layouts, design tokens, responsive strategy
    4. InteractionMaps: per-feature maps with user action, frontend reaction, API call,
       backend processing, DB write, side effects, success/error responses, tracking events
    5. AuthArchitecture: flows, roles, permissions, middleware, multi-tenancy
    6. AgentArchitecture: agents, triggers, I/O contracts, orchestration, prompts, budgets
    7. InfraArchitecture: environments, deploy config, monitoring, performance budgets
    8. TestingStrategy: Playwright specs, API tests, Six Laws verification plan
    Cross-validates all artifacts: schema matches API, API matches frontend, frontend
    matches interaction maps. Flags any inconsistencies.
    If ConstraintManifest provided, treats immutable items as fixed and designs only extensions.
    Output: ArchitectureDesign object with all artifacts.
    Build halts after this for Gate 2 human approval.
    Update STATE_OF_THE_BUILD.md and SESSION_STATE.md from actual codebase audit.

