# ============================================================
# SPRINT 5: Phase 3+4 — Executor + Sentinel (Est. 3-4 hours)
# ============================================================

- id: s5-p01
  name: "Claude Runner and Prompt Assembler"
  description: |
    Create src/engine/claude-runner.ts:
    Wraps Claude Code CLI execution. Spawns child process with:
    `claude -p --dangerously-skip-permissions`
    Pipes assembled prompt via stdin. Captures stdout, stderr, exit code.
    Timeout: 15 minutes. On timeout: kill process, return failure.
    Returns: { stdout, stderr, exitCode, durationMs, tokensEstimated }.
    
    Create src/engine/prompt-assembler.ts:
    Takes a queue entry + governance docs + Build Memory warnings + Sentinel status.
    Assembles the complete prompt by:
    1. Loading the queue entry description
    2. Appending relevant governance excerpts (based on governance_refs)
    3. Querying Build Memory for warnings matching this prompt_type and stack
    4. Appending Sentinel status from previous prompt (if any)
    5. Appending mandatory footer: "Update STATE_OF_THE_BUILD.md and SESSION_STATE.md from actual codebase audit before session ends."
    Returns assembled prompt string and its SHA-256 hash.
    Update STATE_OF_THE_BUILD.md and SESSION_STATE.md from actual codebase audit.

- id: s5-p02
  name: "Failure Predictor and Prompt Rewriter"
  description: |
    Create src/engine/failure-predictor.ts:
    Given a prompt_type, stack_fingerprint, and prompt_index, query Build Memory
    error_patterns for matching trigger conditions. Calculate failure probability
    as: matching_pattern_occurrences / total_builds_with_this_stack_and_type.
    Return: { probability: number, matchingPatterns: ErrorPattern[], recommendation: string }.
    
    Create src/engine/prompt-rewriter.ts:
    When failure probability > 0.4, rewrite the prompt:
    1. Query Build Memory for highest success-rate prompt structures for this task type
    2. Preserve the task objective and governance references
    3. Restructure the instruction approach based on successful precedents
    4. Inject prevention rules from matching error patterns
    5. Log original hash, rewritten hash, and rewrite reason
    Return: { rewrittenPrompt: string, reason: string, originalHash: string }.
    Update STATE_OF_THE_BUILD.md and SESSION_STATE.md from actual codebase audit.

- id: s5-p03
  name: "Git Manager"
  description: |
    Create src/engine/git-manager.ts:
    Handles all git operations for FORGE builds:
    - createBranch(buildId, promptIndex, promptName): creates forge/{buildId}/prompt-{index}-{name}
    - checkout(branchName): switches to branch
    - commitAll(message): stages all changes and commits
    - mergeTomain(): merges current branch to main with --no-ff
    - tagCheckpoint(buildId, promptIndex): creates forge-checkpoint-{buildId}-{index}
    - rollbackToCheckpoint(tag): resets main to checkpoint tag
    - getBranchDiff(): returns file changes on current branch vs main
    - getCurrentBranch(): returns current branch name
    All operations use child_process.execSync with PowerShell commands.
    All operations include error handling — git failures are captured, not thrown.
    Update STATE_OF_THE_BUILD.md and SESSION_STATE.md from actual codebase audit.

- id: s5-p04
  name: "Sentinel Health Checker"
  description: |
    Create src/phases/phase4-sentinel.ts:
    Runs after every prompt execution. Performs health checks in order:
    1. TypeScript: `pnpm tsc --noEmit` — capture output, check exit code
    2. Build: `pnpm run build` — capture output, check exit code
    3. File Integrity: compare current file tree to expected (governance docs unchanged,
       no unexpected deletions). Use git diff --name-status.
    4. Schema Drift: if schema prompts have run, compare DB state (via schema-extractor)
       against SCHEMA_REGISTRY.md. Flag additions (ok) and modifications/deletions (fail).
    5. Dependency Check: compare current package.json dependencies against TOOLCHAIN.md
       manifest. Flag any new dependencies not in manifest.
    Returns SentinelResult: { passed: boolean, checks: CheckResult[], failedCheck: string | null,
    diagnosticReport: string }.
    If ANY check fails: generate diagnostic report with full error context.
    
    Create Autonomous Recovery logic:
    If autonomousRecoveryMode enabled AND matching error pattern with success_rate > 0.90:
    - Apply resolution automatically
    - Re-run the prompt
    - Re-run Sentinel
    - Max 2 auto-recovery attempts per prompt
    - Log everything to Build Memory
    Update STATE_OF_THE_BUILD.md and SESSION_STATE.md from actual codebase audit.

- id: s5-p05
  name: "Phase 3 Build Executor Orchestrator"
  description: |
    Create src/phases/phase3-executor.ts:
    The main build execution loop:
    1. Parse queue.yaml into ordered prompt list
    2. Create build_run in Build Memory (status: running)
    3. For each prompt (respecting dependency order):
       a. Check dependencies completed
       b. Run failure-predictor
       c. If probability > 0.4: run prompt-rewriter
       d. Assemble prompt via prompt-assembler
       e. Create feature branch via git-manager
       f. Execute via claude-runner
       g. Log prompt_execution to Build Memory
       h. Run Sentinel (phase4-sentinel)
       i. If Sentinel passes: merge to main, tag checkpoint
       j. If Sentinel fails: halt or auto-recover
       k. Update STATE_OF_THE_BUILD.md
    4. On completion: update build_run status
    
    Create src/engine/parallel-scheduler.ts:
    Analyzes queue.yaml dependencies to identify parallel groups.
    Prompts with no mutual dependencies can run simultaneously.
    For parallel execution: spawn multiple claude-runner instances,
    each on its own branch. Merge all to main after all pass Sentinel.
    Note: parallel execution is Phase 2 of FORGE 2.0 usage, not Sprint 1.
    For now, implement the dependency analysis and parallel group identification.
    Sequential execution is the default.
    Update STATE_OF_THE_BUILD.md and SESSION_STATE.md from actual codebase audit.

