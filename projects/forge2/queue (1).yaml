    if (Test-Path $learningModule) { Import-Module $learningModule -Force }
    ```

    BEHAVIORAL CONTRACTS (ForgeSync):
    - MUST acquire file lock before writing to master database — always release in finally block
    - MUST detect stale locks (>2 minutes old) and remove them automatically
    - MUST NOT sync during a run — only at SessionStart (Pull) and SessionEnd (Push)
    - Before any sync: verify master drive path is accessible — if not, skip with WARN (never fail a build)
    - All functions: typed param() blocks, Write-Host with colors, never Write-Output

    === FUNCTION 1: Get-SyncConfig ===
    ```powershell
    function Get-SyncConfig {
        [CmdletBinding()]
        param()

        $configPath = Join-Path (Split-Path (Get-ForgeDbPath) -Parent) 'sync_config.json'

        if (Test-Path $configPath) {
            try {
                return (Get-Content $configPath -Raw | ConvertFrom-Json)
            }
            catch {
                Write-Host "  [WARN] sync_config.json corrupt, using defaults" -ForegroundColor Yellow
            }
        }

        # Create default config
        $defaultConfig = @{
            master_path = 'D:\ForgeSync'
            lock_file = 'forge_sync.lock'
            max_wait_seconds = 30
            retry_interval_seconds = 5
            stale_lock_minutes = 2
        }

        $configDir = Split-Path $configPath -Parent
        if (-not (Test-Path $configDir)) { New-Item -ItemType Directory -Path $configDir -Force | Out-Null }
        $defaultConfig | ConvertTo-Json -Depth 10 | Set-Content $configPath -Encoding UTF8
        Write-Host "  Created default sync_config.json at $configPath" -ForegroundColor Gray

        return [PSCustomObject]$defaultConfig
    }
    ```

    === FUNCTION 2: Acquire-SyncLock ===
    ```powershell
    function Acquire-SyncLock {
        [CmdletBinding()]
        param(
            [Parameter(Mandatory=$true)]
            [string]$LockPath
        )

        $config = Get-SyncConfig
        $maxWait = $config.max_wait_seconds
        $retryInterval = $config.retry_interval_seconds
        $staleLockMinutes = $config.stale_lock_minutes
        $elapsed = 0

        while ($elapsed -lt $maxWait) {
            if (-not (Test-Path $LockPath)) {
                # No lock exists — acquire it
                $lockData = @{
                    machine_id = Get-MachineId
                    timestamp = (Get-Date -Format 'o')
                    pid = $PID
                } | ConvertTo-Json -Depth 10
                Set-Content -Path $LockPath -Value $lockData -Encoding UTF8
                Write-Host "  [SYNC] Lock acquired: $LockPath" -ForegroundColor Gray
                return $true
            }

            # Lock exists — check if stale
            $lockAge = (Get-Date) - (Get-Item $LockPath).CreationTime
            if ($lockAge.TotalMinutes -gt $staleLockMinutes) {
                Write-Host "  [SYNC] Removing stale lock ($([math]::Round($lockAge.TotalMinutes, 1)) min old)" -ForegroundColor Yellow
                Remove-Item $LockPath -Force -ErrorAction SilentlyContinue
                continue
            }

            Write-Host "  [SYNC] Lock held by another process, waiting $retryInterval seconds..." -ForegroundColor Yellow
            Start-Sleep -Seconds $retryInterval
            $elapsed += $retryInterval
        }

        Write-Host "  [SYNC] Lock acquisition timed out after $maxWait seconds" -ForegroundColor Red
        return $false
    }
    ```

    === FUNCTION 3: Release-SyncLock ===
    ```powershell
    function Release-SyncLock {
        [CmdletBinding()]
        param(
            [Parameter(Mandatory=$true)]
            [string]$LockPath
        )
        if (Test-Path $LockPath) {
            Remove-Item $LockPath -Force -ErrorAction SilentlyContinue
            Write-Host "  [SYNC] Lock released: $LockPath" -ForegroundColor Gray
        }
    }
    ```

