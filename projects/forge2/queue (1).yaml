  name: "Hook System Schema Parser & Default Generation"
  description: |
    You are building FORGE 2.0 at C:\Users\manag\Documents\FORGE 2.0\
    Implement three functions in modules\ForgeHooks.psm1. This module manages the declarative hook lifecycle system.

    Add this import at the top of the file:
