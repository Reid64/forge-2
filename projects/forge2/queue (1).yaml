    $id = Save-ToForgeMemory -Table 'fix_patterns' -Data @{ error_fingerprint='int-test'; error_message='test'; error_category='COMPILE'; file_path_pattern='*.ps1'; occurrence_count=1; success_rate=0.0 } -DatabasePath $testDb
    $row = Get-FixPattern -Fingerprint 'int-test' -DatabasePath $testDb
    if (-not $row) { throw 'Write/read cycle failed' }
    Write-Host "  Write/read cycle: OK" -ForegroundColor Green

    # Test 4: Error fingerprint
    $fp = Get-ErrorFingerprint -ErrorCode 'ERR001' -FilePath 'test/file.ts' -ErrorMessage 'test error' -TechStack @('powershell')
    if ($fp.Length -ne 64) { throw "Fingerprint wrong length" }
    Write-Host "  Error fingerprint: OK" -ForegroundColor Green

    # Test 5: Register error and fix
    $regFp = Register-Error -ErrorCode 'TEST' -FilePath 'test.ps1' -ErrorMessage 'test' -TechStack @('powershell') -ErrorCategory 'COMPILE' -DatabasePath $testDb
    Register-Fix -Fingerprint $regFp -FixDiff 'diff' -FixDescription 'fix' -DatabasePath $testDb
    Write-Host "  Register error/fix: OK" -ForegroundColor Green

    # Test 6: Hooks
    $hooks = Read-HooksConfig -ProjectPath $root
    Write-Host "  Read hooks config: $(@($hooks).Count) hooks — OK" -ForegroundColor Green

    # Test 7: Build fingerprint
    $bfp = Get-BuildFingerprint -ProjectPath $root
    if ($bfp.Length -ne 64) { throw "Build fingerprint wrong length" }
    Write-Host "  Build fingerprint: OK" -ForegroundColor Green

    # Test 8: Pre-flight checks
    $pf = Invoke-PreFlightChecks -ProjectPath $root
    if (@($pf).Count -ne 8) { throw "Expected 8 checks" }
    Write-Host "  Pre-flight checks: OK" -ForegroundColor Green

    # Test 9: Directory tree scan
    $tree = Invoke-ScanDirectoryTree -ProjectPath $root
    if ($tree.TotalFiles -lt 10) { throw "Too few files" }
    Write-Host "  Directory tree scan: $($tree.TotalFiles) files — OK" -ForegroundColor Green

    # Test 10: Config management
    $config = Get-ForgeConfig -ProjectPath $root
    if (-not $config.max_retries) { throw "Config missing max_retries" }
    Write-Host "  Config management: OK" -ForegroundColor Green

    # Test 11: Gate engine
    $gates = Invoke-ForgeGate -Ring 1 -ProjectPath $root
    Write-Host "  Gate engine: AllPassed=$($gates.AllPassed) — OK" -ForegroundColor Green

    # Cleanup
    Remove-Item $testDb -Force

