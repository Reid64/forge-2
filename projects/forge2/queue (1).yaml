  name: "DIAGNOSE Console Output Formatter"
  description: |
    You are building FORGE 2.0 at C:\Users\manag\Documents\FORGE 2.0\
    Replace Write-Finding and Format-ScanFindings stubs in modules\ForgeRetrofit.psm1 (#region DIAGNOSE).

    ```powershell
    function Write-Finding {
        [CmdletBinding()]
        param([Parameter(Mandatory=$true)][hashtable]$Finding)
        $color = switch ($Finding.Severity) { 'CRITICAL' { 'Red' } 'WARN' { 'Yellow' } 'INFO' { 'Cyan' } default { 'Gray' } }
        Write-Host "  [$($Finding.Severity)]" -ForegroundColor $color -NoNewline
        Write-Host " [$($Finding.Category)] " -ForegroundColor Gray -NoNewline
        Write-Host $Finding.Message
    }

    function Format-ScanFindings {
        [CmdletBinding()]
        param([Parameter(Mandatory=$true)][hashtable]$ScanReport)
        $findings = @()

        # Broken imports -> CRITICAL
        if ($ScanReport.Results -and $ScanReport.Results.BrokenImports) {
            foreach ($bi in $ScanReport.Results.BrokenImports) {
                $findings += @{ Severity='CRITICAL'; Category='IMPORTS'; Message="Broken import in $($bi.SourceFile): $($bi.ImportPath)"; Source='BrokenImports' }
            }
        }

        # Dead files -> WARN
        if ($ScanReport.Results -and $ScanReport.Results.DeadFiles) {
            foreach ($df in $ScanReport.Results.DeadFiles) {
                $path = if ($df -is [hashtable]) { $df.FilePath } else { $df }
                $findings += @{ Severity='WARN'; Category='FILES'; Message="Dead file: $path"; Source='DeadFiles' }
            }
        }

        # Env issues
        if ($ScanReport.Results -and $ScanReport.Results.EnvAudit -and $ScanReport.Results.EnvAudit.Issues) {
            foreach ($issue in $ScanReport.Results.EnvAudit.Issues) {
                $findings += @{ Severity=$issue.Severity; Category='ENV'; Message="$($issue.Variable): $($issue.Issue)"; Source='EnvAudit' }
            }
        }

        # Schema issues
        if ($ScanReport.Results -and $ScanReport.Results.DbSchema -and $ScanReport.Results.DbSchema.Issues) {
            foreach ($issue in $ScanReport.Results.DbSchema.Issues) {
                $findings += @{ Severity=$issue.Severity; Category='SCHEMA'; Message="$($issue.Table): $($issue.Issue)"; Source='DbSchema' }
            }
        }

        # TSC errors -> CRITICAL
        if ($ScanReport.Results -and $ScanReport.Results.TscCheck -and $ScanReport.Results.TscCheck.Errors) {
            foreach ($err in $ScanReport.Results.TscCheck.Errors) {
                $findings += @{ Severity='CRITICAL'; Category='COMPILE'; Message="$($err.Code) in $($err.File):$($err.Line) — $($err.Message)"; Source='TscCheck' }
            }
        }

        # Sort: CRITICAL first, then WARN, then INFO
        $severityOrder = @{ 'CRITICAL'=0; 'WARN'=1; 'INFO'=2 }
        $findings = $findings | Sort-Object { $severityOrder[$_.Severity] }

        return $findings
    }
    ```
