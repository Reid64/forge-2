    Initialize-ForgeMemory -DatabasePath $testDb
    $tables = Invoke-Sqlite -Database $testDb -Query "SELECT name FROM sqlite_master WHERE type='table'"
    if (@($tables).Count -ne 14) { throw "Expected 14 tables, got $(@($tables).Count)" }
    Write-Host "  Database init (14 tables): OK" -ForegroundColor Green

    # Test 2: Machine ID
    $mid = Get-MachineId
    if ($mid.Length -ne 64) { throw "MachineId wrong length" }
    Write-Host "  Machine ID: OK" -ForegroundColor Green

