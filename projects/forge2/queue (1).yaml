    ```powershell
    function Invoke-ScanBrokenImports {
        [CmdletBinding()]
        param(
            [Parameter(Mandatory=$true)]
            [hashtable]$DependencyGraph,

            [Parameter(Mandatory=$true)]
            [string]$ProjectPath
        )

        $broken = @()
        foreach ($edge in $DependencyGraph.Edges) {
            if ($edge.IsExternal) { continue }  # Skip npm packages
            if (-not $edge.ResolvedTarget) {
                $broken += @{
                    SourceFile = $edge.Source
                    ImportPath = $edge.Target
                    ResolvedTarget = $null
                    Issue = 'FILE_NOT_FOUND'
                    Severity = 'CRITICAL'
                }
            }
        }

        Write-Host "  Broken imports found: $($broken.Count)" -ForegroundColor $(if ($broken.Count -gt 0) { 'Red' } else { 'Green' })
        return $broken
    }

    function Invoke-ScanDeadFiles {
        [CmdletBinding()]
        param(
            [Parameter(Mandatory=$true)]
            [hashtable]$DependencyGraph,

            [Parameter(Mandatory=$true)]
            [string]$ProjectPath
        )

        $entryPointPattern = 'page\.(tsx?|jsx?)$|route\.(tsx?|js)$|layout\.(tsx?)$|middleware\.(tsx?|js)$|tailwind\.config|next\.config|tsconfig|\.test\.|\.spec\.|jest\.config|vitest\.config|playwright\.config'

        $importedFiles = @($DependencyGraph.Edges | Where-Object { $_.ResolvedTarget } | ForEach-Object { $_.ResolvedTarget } | Select-Object -Unique)

        $dead = @()
        foreach ($filePath in $DependencyGraph.Nodes.Keys) {
            if ($filePath -match $entryPointPattern) { continue }
            if ($filePath -in $importedFiles) { continue }
            $dead += @{
                FilePath = $filePath
                Severity = 'WARN'
                Recommendation = 'Review for removal or add import'
            }
        }

        Write-Host "  Dead files found: $($dead.Count)" -ForegroundColor $(if ($dead.Count -gt 0) { 'Yellow' } else { 'Green' })
        return $dead
    }
    ```

