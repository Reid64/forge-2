    === Get-MachineId ===
    ```powershell
    function Get-MachineId {
        [CmdletBinding()]
        param()
        $computerName = $env:COMPUTERNAME
        if (-not $computerName) { $computerName = (hostname) }
        $mac = ''
        try {
            $nic = Get-NetAdapter -Physical -ErrorAction SilentlyContinue |
                Where-Object { $_.Status -eq 'Up' } |
                Select-Object -First 1
            if ($nic) { $mac = $nic.MacAddress }
        } catch {
            try {
                $nic = Get-WmiObject Win32_NetworkAdapterConfiguration |
                    Where-Object { $_.IPEnabled -eq $true } |
                    Select-Object -First 1
                if ($nic) { $mac = $nic.MACAddress }
            } catch { $mac = 'unknown' }
        }
        $composite = "$computerName|$mac"
        $sha256 = [System.Security.Cryptography.SHA256]::Create()
        $bytes = [System.Text.Encoding]::UTF8.GetBytes($composite)
        $hash = $sha256.ComputeHash($bytes)
        $sha256.Dispose()
        return ($hash | ForEach-Object { $_.ToString('x2') }) -join ''
    }
    ```

