                return $config
            }
            catch {
                Write-Host "  [WARN] forge_config.json is malformed, using defaults" -ForegroundColor Yellow
            }
        }

        # Return defaults
        return [PSCustomObject]@{
            schema_version = '1.0'
            project_name = (Split-Path $ProjectPath -Leaf)
            project_path = $ProjectPath
            default_tech_stack = @('powershell','sqlite')
            max_retries = 2
            prompts_per_run = 45
            learning_db_path = (Get-ForgeDbPath)
            gates = @(
                @{ name='PowerShellSyntax'; enabled=$true; ring=1; threshold=0 }
                @{ name='PSScriptAnalyzer'; enabled=$true; ring=1; threshold=0 }
                @{ name='SqliteSchema'; enabled=$true; ring=1; threshold=14 }
