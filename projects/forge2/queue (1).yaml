    ```powershell
    function Update-PromptStatus {
        [CmdletBinding()]
        param(
            [Parameter(Mandatory=$true)][string]$BuildId,
            [Parameter(Mandatory=$true)][string]$PromptId,
            [Parameter(Mandatory=$true)][ValidateSet('PASS','FAIL','SKIP','PENDING')][string]$Status,
            [int]$Attempts = 1, [int]$Tokens = 0, [int]$Duration = 0, [string]$Error
        )
        if (-not $Global:ForgePromptStatuses) { $Global:ForgePromptStatuses = @{} }
        $Global:ForgePromptStatuses[$PromptId] = @{ PromptId=$PromptId; Status=$Status; Attempts=$Attempts; Tokens=$Tokens; Duration=$Duration; Error=$Error; Timestamp=(Get-Date -Format 'o') }
    }

    function Get-DetailedQueueStatus {
        [CmdletBinding()]
        param(
            [Parameter(Mandatory=$false)][string]$BuildId,
            [Parameter(Mandatory=$false)][string]$Status
        )
        if (-not $Global:ForgePromptStatuses) { return @{ Prompts=@(); Total=0; Completed=0; Passed=0; Failed=0; Skipped=0; Pending=0; FirstPassRate=0 } }
        $all = $Global:ForgePromptStatuses.Values
        if ($Status) { $all = @($all | Where-Object { $_.Status -eq $Status }) }
        $total = @($Global:ForgePromptStatuses.Values).Count
        $passed = @($Global:ForgePromptStatuses.Values | Where-Object { $_.Status -eq 'PASS' }).Count
        $failed = @($Global:ForgePromptStatuses.Values | Where-Object { $_.Status -eq 'FAIL' }).Count
        $skipped = @($Global:ForgePromptStatuses.Values | Where-Object { $_.Status -eq 'SKIP' }).Count
        $firstPass = @($Global:ForgePromptStatuses.Values | Where-Object { $_.Status -eq 'PASS' -and $_.Attempts -eq 1 }).Count
        $fpr = if ($total -gt 0) { [math]::Round($firstPass / $total * 100, 1) } else { 0 }
        return @{ Prompts=[array]$all; Total=$total; Completed=$passed+$failed+$skipped; Passed=$passed; Failed=$failed; Skipped=$skipped; Pending=0; FirstPassRate=$fpr }
    }
