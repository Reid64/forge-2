- id: r1-014
  name: "Core Pipeline Prompt Execution Orchestrator"
  description: |
    You are building FORGE 2.0 at C:\Users\manag\Documents\FORGE 2.0\
    Implement Invoke-ForgeExecute in modules\ForgeCore.psm1. This is the EXECUTE phase engine — the main loop that processes prompts.

    BEHAVIORAL CONTRACTS:
    - MUST create git snapshot before every prompt execution
    - MUST enforce all configured gates after every prompt
    - MUST NOT execute next prompt if prior blocking gate failed and max retries exhausted — skip and log
    - MUST NOT modify middleware.ts without explicit approval flag

    ```powershell
    function Invoke-ForgeExecute {
        [CmdletBinding()]
        param(
            [Parameter(Mandatory=$true)]
            [string]$ProjectPath,

            [Parameter(Mandatory=$true)]
            [array]$Prompts,

            [Parameter(Mandatory=$true)]
            [scriptblock]$ExecuteBlock,

            [Parameter(Mandatory=$false)]
            [string]$BuildId = [guid]::NewGuid().ToString().Substring(0, 8)
        )

        $config = Get-ForgeConfig -ProjectPath $ProjectPath
        $maxRetries = if ($config.max_retries) { $config.max_retries } else { 2 }
        $totalPrompts = $Prompts.Count

        Initialize-BuildTracker -BuildId $BuildId -ProjectName $config.project_name

        Write-Host "`n========================================" -ForegroundColor Cyan
        Write-Host "  FORGE EXECUTE — $totalPrompts prompts" -ForegroundColor Cyan
        Write-Host "  Build: $BuildId" -ForegroundColor Gray
        Write-Host "========================================`n" -ForegroundColor Cyan

        $totalPass = 0
        $totalFail = 0
        $totalRetry = 0
        $lastGateFailed = $false

        for ($i = 0; $i -lt $totalPrompts; $i++) {
            $prompt = $Prompts[$i]
            $promptId = if ($prompt -is [hashtable] -and $prompt.id) { $prompt.id } else { "P-$($i+1)" }

            Write-Host "`n--- Prompt $($i+1)/$totalPrompts : $promptId ---" -ForegroundColor Cyan

            # Skip if prior blocking gate failed
            if ($lastGateFailed) {
                Write-Host "  [SKIP] Skipping due to prior blocking gate failure" -ForegroundColor Yellow
                Update-BuildTracker -PromptId $promptId -Status 'SKIP'
                continue
            }

            # Step 1: Git snapshot
            New-ForgeSnapshot -ProjectPath $ProjectPath -PromptId $promptId

            # Step 2: PreToolUse hooks (if available)
            try {
                $hookCmd = Get-Command Invoke-Hook -ErrorAction SilentlyContinue
                if ($hookCmd) {
                    Invoke-Hook -Event 'PreToolUse' -Context @{
                        project_path = $ProjectPath
                        prompt_number = ($i + 1)
                        build_id = $BuildId
                        task_type = 'SCAFFOLD'
                    } -ProjectPath $ProjectPath
                }
            } catch { Write-Host "  [WARN] PreToolUse hook error: $($_.Exception.Message)" -ForegroundColor Yellow }

            # Step 3: Execute with retry
            $result = Invoke-PromptWithRetry -ProjectPath $ProjectPath -PromptId $promptId -ExecuteBlock $ExecuteBlock -MaxRetries $maxRetries

            # Step 4: PostToolUse hooks
            try {
                if ($hookCmd) {
                    Invoke-Hook -Event 'PostToolUse' -Context @{
                        project_path = $ProjectPath
                        prompt_number = ($i + 1)
                        build_id = $BuildId
                    } -ProjectPath $ProjectPath
                }
            } catch { Write-Host "  [WARN] PostToolUse hook error: $($_.Exception.Message)" -ForegroundColor Yellow }

            # Step 5: Gate check
            $gateResult = Invoke-ForgeGate -Ring 1 -ProjectPath $ProjectPath
            if (-not $gateResult.AllPassed -and $result.Status -eq 'PASS') {
                Write-Host "  [GATE] Gate failed after successful execution — marking as FAIL" -ForegroundColor Red
                $result.Status = 'FAIL'
                $lastGateFailed = $true
            }

            # Step 6: Update tracker
            Update-BuildTracker -PromptId $promptId -Status $result.Status -Attempts $result.Attempts -Duration ([math]::Round($result.Duration / 1000))

            if ($result.Status -eq 'PASS') { $totalPass++ }
            elseif ($result.Status -eq 'FAIL') {
                $totalFail++
                if ($result.Attempts -gt 1) { $totalRetry++ }
            }

            # Step 7: Ring 2 sentinel check (every 10th prompt)
            if (($i + 1) % 10 -eq 0) {
                try {
                    $sentinelCmd = Get-Command Invoke-SentinelRing -ErrorAction SilentlyContinue
                    if ($sentinelCmd) {
                        Write-Host "  [SENTINEL] Ring 2 check at prompt $($i+1)" -ForegroundColor Cyan
                        Invoke-SentinelRing -Ring 'Ring2' -ProjectPath $ProjectPath
                    } else {
                        Write-Host "  [SENTINEL] Ring 2 SKIP — Sentinel not available" -ForegroundColor Yellow
                    }
                } catch { Write-Host "  [WARN] Sentinel error: $($_.Exception.Message)" -ForegroundColor Yellow }
            }

            # Step 8: PreCompact check (80% through queue)
            if (($i + 1) -eq [math]::Floor($totalPrompts * 0.8)) {
                try {
                    if ($hookCmd) {
                        Invoke-Hook -Event 'PreCompact' -Context @{ project_path=$ProjectPath; build_id=$BuildId; prompt_number=($i+1) } -ProjectPath $ProjectPath
                    }
                } catch { Write-Host "  [WARN] PreCompact hook error: $($_.Exception.Message)" -ForegroundColor Yellow }
            }

            # Step 9: Git commit
            $commitStatus = if ($result.Status -eq 'PASS') { 'PASS' } else { 'FAIL' }
            New-ForgeCommit -ProjectPath $ProjectPath -Project $config.project_name -Phase 'EXECUTE' -Task $promptId -Status $commitStatus
        }

        # Generate build report
        Export-BuildReport -ProjectPath $ProjectPath

        Write-Host "`n========================================" -ForegroundColor Cyan
        Write-Host "  FORGE EXECUTE COMPLETE" -ForegroundColor Cyan
        Write-Host "  Passed: $totalPass  Failed: $totalFail  Retried: $totalRetry" -ForegroundColor $(if ($totalFail -eq 0) { 'Green' } else { 'Yellow' })
        Write-Host "========================================`n" -ForegroundColor Cyan

        return @{
            TotalPass = $totalPass
            TotalFail = $totalFail
            TotalRetry = $totalRetry
            Results = $Global:ForgeBuildTracker.Results
        }
    }
    ```

