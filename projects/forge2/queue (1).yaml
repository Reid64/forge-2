  description: |
    You are building FORGE 2.0 at C:\Users\manag\Documents\FORGE 2.0\
    Implement six functions in modules\ForgeSync.psm1. This module manages synchronization of the learning database between machines via an 18TB external drive.

    Add this import at the top of the file:
    ```powershell
