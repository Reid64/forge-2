- id: r1-038
  name: "Session Run Lifecycle Integration"
  description: |
    You are building FORGE 2.0 at C:\Users\manag\Documents\FORGE 2.0\
    Replace Invoke-RunStart and Invoke-RunEnd stubs in modules\ForgeSession.psm1. Wire into forge.ps1.

    ```powershell
    function Invoke-RunStart {
        [CmdletBinding()]
        param([Parameter(Mandatory=$true)][string]$ProjectPath, [Parameter(Mandatory=$true)][string]$BuildId)

        Write-Host "`n========================================" -ForegroundColor Cyan
        Write-Host "  FORGE RUN START" -ForegroundColor Cyan
        Write-Host "========================================" -ForegroundColor Cyan

        # Step 1: Crash recovery
        $crash = Test-CrashRecovery -ProjectPath $ProjectPath
        if ($crash.CrashDetected) {
            Write-Host "  [RECOVERED] Previous run '$($crash.BuildId)' did not complete cleanly" -ForegroundColor Yellow
        }

        # Step 2: Resume check
        $resumeResult = Resume-ForgeSession -ProjectPath $ProjectPath

        # Step 3: Fingerprint
        $fp = Get-BuildFingerprint -ProjectPath $ProjectPath
        Write-Host "  Fingerprint: $($fp.Substring(0,16))..." -ForegroundColor Gray

        # Step 4: Lock
        Set-ForgeLock -ProjectPath $ProjectPath -BuildId $BuildId

        # Step 5: Store globals
        $Global:ForgeRunStartTime = Get-Date
        $Global:ForgeBuildId = $BuildId
        $Global:ForgeProjectPath = $ProjectPath

        Write-Host "  Run started: $BuildId" -ForegroundColor Green
        return @{ BuildId=$BuildId; Fingerprint=$fp; ResumeResult=$resumeResult; StartTime=$Global:ForgeRunStartTime }
    }

    function Invoke-RunEnd {
        [CmdletBinding()]
        param(
            [Parameter(Mandatory=$true)][string]$ProjectPath,
            [Parameter(Mandatory=$false)][hashtable]$State,
            [Parameter(Mandatory=$false)][string]$EndReason = 'COMPLETED'
        )

        Write-Host "`n========================================" -ForegroundColor Cyan
        Write-Host "  FORGE RUN END — $EndReason" -ForegroundColor Cyan
        Write-Host "========================================" -ForegroundColor Cyan

        try {
            # Step 1: Export state
            if ($State) {
                $State['end_reason'] = $EndReason
                $State['build_fingerprint'] = Get-BuildFingerprint -ProjectPath $ProjectPath
                Export-SessionState -ProjectPath $ProjectPath -State $State
            }

            # Step 2: Build report
            try { Export-BuildReport -ProjectPath $ProjectPath } catch { Write-Host "  [WARN] Build report failed: $($_.Exception.Message)" -ForegroundColor Yellow }

            # Step 3: Handoff
            if ($State) {
                try { Export-SessionHandoff -ProjectPath $ProjectPath -State $State } catch { Write-Host "  [WARN] Handoff failed: $($_.Exception.Message)" -ForegroundColor Yellow }
            }

            # Step 4: Duration
            if ($Global:ForgeRunStartTime) {
                $duration = (Get-Date) - $Global:ForgeRunStartTime
                Write-Host "  Duration: $([math]::Round($duration.TotalMinutes, 1)) minutes" -ForegroundColor Gray
            }
        }
        finally {
            # ALWAYS remove lock
            Remove-ForgeLock -ProjectPath $ProjectPath
            Write-Host "  Run ended: $EndReason" -ForegroundColor $(if ($EndReason -eq 'COMPLETED') { 'Green' } else { 'Yellow' })
        }
    }
    ```

