    Implement Invoke-ForgeGate and three built-in gate functions in modules\ForgeCore.psm1.

    Gates are quality checks that run after every prompt execution. They determine if the prompt's output is acceptable. If gates fail, the prompt is retried.

    BEHAVIORAL CONTRACTS (ForgeCore):
    - MUST enforce all configured gates after every prompt — gate failures trigger retry logic
    - Console: Write-Host with colors (Green=PASS, Red=FAIL, Yellow=WARN/SKIP)

    === Test-PowerShellSyntax ===
    ```powershell
    function Test-PowerShellSyntax {
        [CmdletBinding()]
        param(
            [Parameter(Mandatory=$true)]
            [string]$ProjectPath
        )

        $sw = [System.Diagnostics.Stopwatch]::StartNew()
        $allFiles = Get-ChildItem -Path $ProjectPath -Recurse -Include *.ps1,*.psm1 -ErrorAction SilentlyContinue
        $errors = @()

        foreach ($file in $allFiles) {
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$null, [ref]$parseErrors)
            if ($parseErrors.Count -gt 0) {
                $errors += @{
                    File = $file.Name
                    FullPath = $file.FullName
                    Error = $parseErrors[0].Message
                    Line = $parseErrors[0].Extent.StartLineNumber
                }
            }
        }
        $sw.Stop()

        if ($errors.Count -gt 0) {
            $errorDetail = ($errors | ForEach-Object { "$($_.File):$($_.Line) — $($_.Error)" }) -join "`n"
            return @{ Name='PowerShellSyntax'; Status='FAIL'; Duration=$sw.ElapsedMilliseconds; Details=$errorDetail; ErrorCount=$errors.Count }
        }
        return @{ Name='PowerShellSyntax'; Status='PASS'; Duration=$sw.ElapsedMilliseconds; Details="$($allFiles.Count) files checked"; ErrorCount=0 }
    }
    ```

    === Test-PSScriptAnalyzer ===
    ```powershell
    function Test-PSScriptAnalyzer {
        [CmdletBinding()]
        param(
            [Parameter(Mandatory=$true)]
            [string]$ProjectPath
        )

        $sw = [System.Diagnostics.Stopwatch]::StartNew()

        if (-not (Get-Module -ListAvailable -Name PSScriptAnalyzer)) {
            $sw.Stop()
            return @{ Name='PSScriptAnalyzer'; Status='SKIP'; Duration=$sw.ElapsedMilliseconds; Details='PSScriptAnalyzer module not installed'; ErrorCount=0 }
        }

        try {
            $results = Invoke-ScriptAnalyzer -Path $ProjectPath -Recurse -ExcludeRule PSAvoidUsingWriteHost -ErrorAction SilentlyContinue
            $sw.Stop()

            $errorResults = $results | Where-Object { $_.Severity -eq 'Error' }
            if ($errorResults -and $errorResults.Count -gt 0) {
                $detail = ($errorResults | ForEach-Object { "$($_.ScriptName):$($_.Line) — $($_.Message)" }) -join "`n"
                return @{ Name='PSScriptAnalyzer'; Status='FAIL'; Duration=$sw.ElapsedMilliseconds; Details=$detail; ErrorCount=$errorResults.Count }
            }
            return @{ Name='PSScriptAnalyzer'; Status='PASS'; Duration=$sw.ElapsedMilliseconds; Details="$($results.Count) findings (no errors)"; ErrorCount=0 }
        }
        catch {
            $sw.Stop()
            return @{ Name='PSScriptAnalyzer'; Status='SKIP'; Duration=$sw.ElapsedMilliseconds; Details="Error running analyzer: $($_.Exception.Message)"; ErrorCount=0 }
        }
    }
    ```

    === Test-SqliteSchema ===
    ```powershell
    function Test-SqliteSchema {
        [CmdletBinding()]
        param(
            [Parameter(Mandatory=$false)]
            [string]$DatabasePath
        )

        if (-not $DatabasePath) { $DatabasePath = Get-ForgeDbPath }
        $sw = [System.Diagnostics.Stopwatch]::StartNew()

        if (-not (Test-Path $DatabasePath)) {
            $sw.Stop()
            return @{ Name='SqliteSchema'; Status='FAIL'; Duration=$sw.ElapsedMilliseconds; Details="Database not found: $DatabasePath"; ErrorCount=1 }
        }

        $expected = @('adversary_findings','build_fingerprints','build_outcomes','compact_snapshots','decision_weights','fix_patterns','forge_meta','governance_rules','hook_execution_log','pending_evolutions','prompt_scores','reconcile_decisions','scan_reports','skill_library')

        try {
            $tables = Invoke-Sqlite -Database $DatabasePath -Query "SELECT name FROM sqlite_master WHERE type='table' ORDER BY name"
            $tableNames = @($tables | ForEach-Object { $_.name } | Sort-Object)

            $missing = $expected | Where-Object { $_ -notin $tableNames }
            $sw.Stop()

            if ($missing.Count -gt 0) {
                return @{ Name='SqliteSchema'; Status='FAIL'; Duration=$sw.ElapsedMilliseconds; Details="Missing tables: $($missing -join ', ')"; ErrorCount=$missing.Count }
            }
            return @{ Name='SqliteSchema'; Status='PASS'; Duration=$sw.ElapsedMilliseconds; Details="All 14 tables present"; ErrorCount=0 }
        }
        catch {
            $sw.Stop()
            return @{ Name='SqliteSchema'; Status='FAIL'; Duration=$sw.ElapsedMilliseconds; Details="Query error: $($_.Exception.Message)"; ErrorCount=1 }
        }
    }
    ```

    === Invoke-ForgeGate ===
    ```powershell
    function Invoke-ForgeGate {
        [CmdletBinding()]
        param(
            [Parameter(Mandatory=$true)]
            [int]$Ring,

            [Parameter(Mandatory=$true)]
            [string]$ProjectPath
        )

        $config = Get-ForgeConfig -ProjectPath $ProjectPath
        $results = @()

        # Run built-in gates matching the ring
        foreach ($gate in $config.gates) {
            if (-not $gate.enabled) { continue }
            if ($gate.ring -ne $Ring) { continue }

            $gateResult = switch ($gate.name) {
                'PowerShellSyntax' { Test-PowerShellSyntax -ProjectPath $ProjectPath }
                'PSScriptAnalyzer' { Test-PSScriptAnalyzer -ProjectPath $ProjectPath }
                'SqliteSchema'     { Test-SqliteSchema }
                default {
                    @{ Name=$gate.name; Status='SKIP'; Duration=0; Details="Unknown gate: $($gate.name)"; ErrorCount=0 }
                }
            }

            $statusColor = switch ($gateResult.Status) {
                'PASS' { 'Green' }
                'FAIL' { 'Red' }
                'SKIP' { 'Yellow' }
            }
            Write-Host "  [GATE] $($gateResult.Name): $($gateResult.Status) ($($gateResult.Duration)ms)" -ForegroundColor $statusColor

            $results += $gateResult
        }

        $allPassed = ($results | Where-Object { $_.Status -eq 'FAIL' }).Count -eq 0
        return @{ AllPassed = $allPassed; Results = $results }
    }
    ```

