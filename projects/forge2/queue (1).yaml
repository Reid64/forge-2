    function Update-BuildTracker {
        [CmdletBinding()]
        param(
            [Parameter(Mandatory=$true)]
            [string]$PromptId,

            [Parameter(Mandatory=$true)]
            [ValidateSet('PASS','FAIL','SKIP')]
            [string]$Status,

            [Parameter(Mandatory=$false)]
            [int]$Attempts = 1,

            [Parameter(Mandatory=$false)]
            [int]$Tokens = 0,

