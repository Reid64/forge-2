    BEHAVIORAL CONTRACTS (ForgeHooks):
    - hooks.json lives at PROJECT ROOT (not .forge\) — Read-HooksConfig reads from $ProjectPath\hooks.json
    - Before executing any hook: verify hooks.json parses as valid JSON. If malformed, fall back to hardcoded minimal hooks (tsc-check, gitleaks-scan only)
    - MUST execute hooks in priority order (ascending) within each event
    - MUST NOT execute disabled hooks — skip silently, no logging
    - Data: ConvertTo-Json -Depth 10

    === Read-HooksConfig ===
    ```powershell
    function Read-HooksConfig {
        [CmdletBinding()]
        param(
            [Parameter(Mandatory=$true)]
            [string]$ProjectPath
        )

        $hooksPath = Join-Path $ProjectPath 'hooks.json'

        if (-not (Test-Path $hooksPath)) {
            Write-Host "  [HOOKS] No hooks.json found at $ProjectPath — returning empty config" -ForegroundColor Yellow
            return @()
        }

        try {
            $raw = Get-Content $hooksPath -Raw | ConvertFrom-Json
            $hooks = @()
            if ($raw.hooks) {
                foreach ($h in $raw.hooks) {
                    $hooks += [PSCustomObject]@{
                        name = $h.name
                        event = $h.event
                        action = if ($h.action) { $h.action } else { 'powershell' }
                        script = $h.script
                        blocking = [bool]$h.blocking
                        timeout_seconds = [int](if ($h.timeout_seconds) { $h.timeout_seconds } else { 30 })
                        enabled = [bool]$h.enabled
                        on_failure = if ($h.on_failure) { $h.on_failure } else { 'BLOCK' }
                        priority = [int](if ($h.priority) { $h.priority } else { 50 })
                        description = if ($h.description) { $h.description } else { '' }
                        conditions = $h.conditions
                    }
                }
            }

            # Sort by priority within each event
            $sorted = $hooks | Sort-Object priority
            return $sorted
        }
        catch {
            Write-Host "  [HOOKS] hooks.json malformed — falling back to minimal hooks" -ForegroundColor Red
            # Minimal fallback: syntax check only
            return @(
                [PSCustomObject]@{ name='tsc-check-fallback'; event='PostToolUse'; action='powershell'; script=$null; blocking=$true; timeout_seconds=60; enabled=$true; on_failure='BLOCK'; priority=10; description='Fallback syntax check'; conditions=$null }
            )
        }
    }
    ```

    === Test-HooksSchema ===
    ```powershell
    function Test-HooksSchema {
        [CmdletBinding()]
        param(
            [Parameter(Mandatory=$true)]
            [PSCustomObject]$Config
        )

        $validEvents = @('SessionStart','PreToolUse','PostToolUse','PreCommit','PreCompact','PreDeploy','PostDeploy','SessionEnd')

        if (-not $Config.schema_version) {
            Write-Host "  [HOOKS] Schema validation failed: missing schema_version" -ForegroundColor Red
            return $false
        }

        if (-not $Config.hooks) { return $true }  # Empty hooks is valid

        $names = @()
        foreach ($hook in $Config.hooks) {
            # Required fields
            if (-not $hook.name) { Write-Host "  [HOOKS] Hook missing 'name' field" -ForegroundColor Red; return $false }
            if (-not $hook.event) { Write-Host "  [HOOKS] Hook '$($hook.name)' missing 'event' field" -ForegroundColor Red; return $false }
            if ($hook.event -notin $validEvents) { Write-Host "  [HOOKS] Hook '$($hook.name)' has invalid event '$($hook.event)'. Valid: $($validEvents -join ', ')" -ForegroundColor Red; return $false }

            # Timeout range
            if ($hook.timeout_seconds -and ($hook.timeout_seconds -lt 5 -or $hook.timeout_seconds -gt 600)) {
                Write-Host "  [HOOKS] Hook '$($hook.name)' timeout_seconds must be 5-600, got $($hook.timeout_seconds)" -ForegroundColor Red
                return $false
            }

            # Unique names
            if ($hook.name -in $names) { Write-Host "  [HOOKS] Duplicate hook name: $($hook.name)" -ForegroundColor Red; return $false }
            $names += $hook.name
        }

        return $true
    }
    ```

    === New-DefaultHooksConfig ===
