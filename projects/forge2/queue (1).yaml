    === FUNCTION 5: Score-PromptExecution ===
    ```powershell
    function Score-PromptExecution {
        [CmdletBinding()]
        param(
            [Parameter(Mandatory=$true)][string]$TemplateHash,
            [Parameter(Mandatory=$true)][string]$TaskType,
            [Parameter(Mandatory=$true)][string[]]$TechStack,
            [Parameter(Mandatory=$true)][hashtable[]]$GateResults,
            [Parameter(Mandatory=$true)][int]$TokensConsumed,
            [Parameter(Mandatory=$true)][int]$RetryCount,
            [Parameter(Mandatory=$true)][string]$ProjectName,
            [Parameter(Mandatory=$true)][string]$BuildId,
            [Parameter(Mandatory=$false)][string]$DatabasePath
        )

        # Calculate gate_pass_rate from gate results
        $totalGates = $GateResults.Count
        $passedGates = ($GateResults | Where-Object { $_.Status -eq 'PASS' }).Count
        $gatePassRate = if ($totalGates -gt 0) { [math]::Round($passedGates / $totalGates, 4) } else { 1.0 }

        # Calculate first_pass_success
        $firstPassSuccess = if ($RetryCount -eq 0) { 1 } else { 0 }

        # drift_score starts at 0 — will be calculated from file diff analysis in future
        $driftScore = 0.0

        Save-PromptScore -TemplateHash $TemplateHash -TaskType $TaskType -TechStack $TechStack `
            -FirstPassSuccess $firstPassSuccess -RetryCount $RetryCount -TokensConsumed $TokensConsumed `
            -GatePassRate $gatePassRate -DriftScore $driftScore -ProjectName $ProjectName -BuildId $BuildId `
            -DatabasePath $DatabasePath
    }
    ```

    === FUNCTION 6: Invoke-AutoElevation ===
    ```powershell
    function Invoke-AutoElevation {
        [CmdletBinding()]
        param(
            [Parameter(Mandatory=$true)]
            [string]$Fingerprint,

            [Parameter(Mandatory=$false)]
            [string]$DatabasePath
        )

        if (-not $DatabasePath) { $DatabasePath = Get-ForgeDbPath }

        $pattern = Get-FixPattern -Fingerprint $Fingerprint -DatabasePath $DatabasePath
        if (-not $pattern) { return }
        if ($pattern.occurrence_count -lt 3) { return }
        if ($pattern.governance_rule_id) { return }  # Already elevated

        # Create governance rule from pattern
        $ruleId = Save-ToForgeMemory -Table 'governance_rules' -Data @{
            rule_text = "Auto-elevated: $($pattern.fix_description)"
            rule_short_name = "auto-$Fingerprint".Substring(0, [Math]::Min(50, "auto-$Fingerprint".Length))
            source = 'AUTO_ELEVATED'
            source_error_fingerprint = $Fingerprint
            tech_stack_tags = $pattern.tech_stack_tags
            scope = 'GLOBAL'
            active = 1
            enforcement_count = 0
        } -DatabasePath $DatabasePath

        # Link back to fix pattern
        Invoke-Sqlite -Database $DatabasePath -Query "UPDATE fix_patterns SET governance_rule_id = '$ruleId' WHERE error_fingerprint = '$Fingerprint'"

        Write-Host "  [AUTO-ELEVATE] Pattern '$Fingerprint' elevated to governance rule $ruleId (occurrence_count=$($pattern.occurrence_count))" -ForegroundColor Cyan
    }
    ```

