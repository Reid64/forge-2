    ```powershell
    function Handle-FingerprintMismatch {
        [CmdletBinding()]
        param(
            [Parameter(Mandatory=$true)][string]$ProjectPath,
            [string]$ExpectedFingerprint, [string]$ActualFingerprint,
            [ValidateSet('CONTINUE','ROLLBACK','ABORT')][string]$Decision
        )
        Push-Location $ProjectPath
        try {
            $changedFiles = @(git diff --name-only 2>$null)
            $changedFiles += @(git diff --cached --name-only 2>$null)
            $changedFiles += @(git ls-files --others --exclude-standard 2>$null)
            $changedFiles = $changedFiles | Select-Object -Unique
        } finally { Pop-Location }

        Write-Host "`n  === Fingerprint Mismatch ===" -ForegroundColor Yellow
        Write-Host "  $($changedFiles.Count) file(s) changed since last session:" -ForegroundColor Yellow
        $display = $changedFiles | Select-Object -First 20
        foreach ($f in $display) { Write-Host "    $f" -ForegroundColor Gray }
        if ($changedFiles.Count -gt 20) { Write-Host "    ... and $($changedFiles.Count - 20) more" -ForegroundColor Gray }

        $highImpact = $changedFiles | Where-Object { $_ -match 'STATE_OF_THE_BUILD|BLUEPRINT|SCHEMA_REGISTRY|middleware|migration' }
        if ($highImpact) {
            Write-Host "  HIGH-IMPACT changes detected:" -ForegroundColor Red
            foreach ($f in $highImpact) { Write-Host "    $f" -ForegroundColor Red }
        }

        if (-not $Decision) {
            Write-Host "`n  [C]ontinue | [R]ollback | [A]bort" -ForegroundColor Cyan
            $input = Read-Host "  Choice"
            $Decision = switch ($input.ToUpper()) { 'C' { 'CONTINUE' } 'R' { 'ROLLBACK' } default { 'ABORT' } }
        }

        return @{ Continue=($Decision -eq 'CONTINUE'); Action=$Decision; ChangedFiles=$changedFiles; HighImpact=$highImpact }
    }
