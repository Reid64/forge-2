    General-purpose query function. All other read functions can delegate to this internally.

    ```powershell
    function Get-ForgeMemory {
        [CmdletBinding()]
        param(
            [Parameter(Mandatory=$true)]
            [string]$Table,

            [Parameter(Mandatory=$false)]
            [string]$Where,

            [Parameter(Mandatory=$false)]
            [string]$OrderBy,

            [Parameter(Mandatory=$false)]
            [int]$Limit = 1000,

            [Parameter(Mandatory=$false)]
            [string]$DatabasePath
        )

        if (-not $DatabasePath) { $DatabasePath = Get-ForgeDbPath }

        $query = "SELECT * FROM $Table"
        if ($Where) { $query += " WHERE $Where" }
        if ($OrderBy) { $query += " ORDER BY $OrderBy" }
        if ($Limit -gt 0) { $query += " LIMIT $Limit" }

        try {
            $results = Invoke-Sqlite -Database $DatabasePath -Query $query
            if ($null -eq $results) { return @() }
            if ($results -isnot [array]) { return @($results) }
            return $results
        }
        catch {
            Write-Host "  [WARN] Get-ForgeMemory query failed: $($_.Exception.Message)" -ForegroundColor Yellow
            return @()
        }
    }
    ```

    === FUNCTION 2: Get-FixPattern ===
    Lookup a single fix pattern by error fingerprint hash.

    ```powershell
    function Get-FixPattern {
        [CmdletBinding()]
        param(
            [Parameter(Mandatory=$true)]
            [string]$Fingerprint,

            [Parameter(Mandatory=$false)]
            [string]$DatabasePath
        )

        if (-not $DatabasePath) { $DatabasePath = Get-ForgeDbPath }

        $results = Get-ForgeMemory -Table 'fix_patterns' -Where "error_fingerprint = '$Fingerprint'" -Limit 1 -DatabasePath $DatabasePath
        if ($results.Count -eq 0) { return $null }
        return $results[0]
    }
    ```

    === FUNCTION 3: Get-GovernanceRules ===
    Returns active governance rules matching a tech stack and project. Returns both GLOBAL and PROJECT_SPECIFIC scoped rules.

    ```powershell
    function Get-GovernanceRules {
        [CmdletBinding()]
        param(
            [Parameter(Mandatory=$true)]
            [string[]]$TechStack,

            [Parameter(Mandatory=$false)]
            [string]$ProjectName,

            [Parameter(Mandatory=$false)]
            [string]$DatabasePath
        )

        if (-not $DatabasePath) { $DatabasePath = Get-ForgeDbPath }

        # Build WHERE clause for scope
        $scopeClause = "active = 1 AND (scope = 'GLOBAL'"
        if ($ProjectName) {
            $scopeClause += " OR (scope = 'PROJECT_SPECIFIC' AND project_name = '$ProjectName')"
        }
        $scopeClause += ")"

        $allRules = Get-ForgeMemory -Table 'governance_rules' -Where $scopeClause -DatabasePath $DatabasePath

        # Filter by tech stack tag intersection
        $matchingRules = @()
        foreach ($rule in $allRules) {
            $ruleTags = @()
            try {
                if ($rule.tech_stack_tags) {
                    $ruleTags = $rule.tech_stack_tags | ConvertFrom-Json -ErrorAction SilentlyContinue
                }
            } catch { }

            if (-not $ruleTags -or $ruleTags.Count -eq 0) {
                # Rules with no tags match everything
                $matchingRules += $rule
                continue
            }

            $intersection = $ruleTags | Where-Object { $_ -in $TechStack }
            if ($intersection) {
                $matchingRules += $rule
            }
        }

        return $matchingRules
    }
    ```

