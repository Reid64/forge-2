- id: r1-007
  name: "Error Fingerprinting & Fix Registration"
  description: |
    You are building FORGE 2.0 at C:\Users\manag\Documents\FORGE 2.0\
    Implement four functions in modules\ForgeLearning.psm1. Replace the existing stubs.

    These functions implement the core of Learning Loop 2 — error pattern recognition. When errors occur, they are fingerprinted so that the same error pattern across different files produces the same fingerprint. This allows FORGE to recognize recurring patterns and auto-propose fixes.

    BEHAVIORAL CONTRACTS:
    - Get-ErrorFingerprint MUST produce identical fingerprints for the same error pattern across different files (generalized path + templated message)
    - All database operations via Invoke-Sqlite
    - Every catch must re-throw or write visible message — never silent

    === FUNCTION 1: ConvertTo-GeneralizedPath ===
    ```powershell
    function ConvertTo-GeneralizedPath {
        [CmdletBinding()]
        param(
            [Parameter(Mandatory=$true)]
            [string]$FilePath
        )

        $generalized = $FilePath
        # Replace Next.js dynamic segments: [id], [...slug], [[...slug]]
        $generalized = $generalized -replace '\[{1,2}\.{0,3}[a-zA-Z0-9_]+\]{1,2}', '*'
        # Replace UUID-like segments (8-4-4-4-12 hex pattern)
        $generalized = $generalized -replace '[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}', '*'
        # Replace pure numeric path segments
        $generalized = $generalized -replace '(?<=[/\\])\d+(?=[/\\])', '*'
        # Replace specific named segments in common API patterns (keep the route structure)
        $generalized = $generalized -replace '(?<=api/)[^/\\]+(?=/)', '*'

        return $generalized
    }
    ```

    === FUNCTION 2: Get-ErrorFingerprint ===
    ```powershell
    function Get-ErrorFingerprint {
        [CmdletBinding()]
        param(
            [Parameter(Mandatory=$true)]
            [string]$ErrorCode,

            [Parameter(Mandatory=$true)]
            [string]$FilePath,

            [Parameter(Mandatory=$true)]
            [string]$ErrorMessage,

            [Parameter(Mandatory=$true)]
            [string[]]$TechStack
        )

        # Component 1: Error code (as-is)
        $component1 = $ErrorCode

        # Component 2: Generalized file path
        $component2 = ConvertTo-GeneralizedPath -FilePath $FilePath

        # Component 3: Templated error message
        # Replace quoted identifiers: './StormMap' -> '*'
        $component3 = $ErrorMessage -replace "'[^']*'", "'*'"
        $component3 = $component3 -replace '"[^"]*"', '"*"'
        # Replace specific module/variable names after common keywords
        $component3 = $component3 -replace '(?<=Module\s+)[^\s]+', '*'
        $component3 = $component3 -replace '(?<=Cannot find\s+)[^\s]+', '*'

        # Component 4: Sorted tech stack
        $component4 = ($TechStack | Sort-Object) -join ','

        # Compute SHA-256 hash of all four components
        $composite = "$component1|$component2|$component3|$component4"
        $sha256 = [System.Security.Cryptography.SHA256]::Create()
        $bytes = [System.Text.Encoding]::UTF8.GetBytes($composite)
        $hash = $sha256.ComputeHash($bytes)
        $sha256.Dispose()

        return ($hash | ForEach-Object { $_.ToString('x2') }) -join ''
    }
    ```

    === FUNCTION 3: Register-Error ===
    ```powershell
    function Register-Error {
        [CmdletBinding()]
        param(
            [Parameter(Mandatory=$true)]
            [string]$ErrorCode,

            [Parameter(Mandatory=$true)]
            [string]$FilePath,

            [Parameter(Mandatory=$true)]
            [string]$ErrorMessage,

            [Parameter(Mandatory=$true)]
            [string[]]$TechStack,

            [Parameter(Mandatory=$false)]
            [string]$ErrorCategory = 'RUNTIME',

            [Parameter(Mandatory=$false)]
            [string]$DatabasePath
        )

        if (-not $DatabasePath) { $DatabasePath = Get-ForgeDbPath }

        $fingerprint = Get-ErrorFingerprint -ErrorCode $ErrorCode -FilePath $FilePath -ErrorMessage $ErrorMessage -TechStack $TechStack

        $existing = Get-FixPattern -Fingerprint $fingerprint -DatabasePath $DatabasePath
        if ($existing) {
            # Increment existing pattern
            Update-FixPattern -Fingerprint $fingerprint -DatabasePath $DatabasePath
            Write-Host "  [LEARN] Known error pattern (occurrence #$($existing.occurrence_count + 1)): $ErrorCode" -ForegroundColor Cyan
        }
        else {
            # Create new pattern
            Save-ToForgeMemory -Table 'fix_patterns' -Data @{
                error_fingerprint = $fingerprint
                error_message = $ErrorMessage
                error_category = $ErrorCategory
                file_path_pattern = (ConvertTo-GeneralizedPath -FilePath $FilePath)
                tech_stack_tags = ($TechStack | ConvertTo-Json -Depth 10 -Compress)
                occurrence_count = 1
                success_rate = 0.0
                times_fix_applied = 0
                times_fix_succeeded = 0
            } -DatabasePath $DatabasePath
            Write-Host "  [LEARN] New error pattern registered: $ErrorCode -> $fingerprint" -ForegroundColor Cyan
        }

        return $fingerprint
    }
    ```

    === FUNCTION 4: Register-Fix ===
    ```powershell
    function Register-Fix {
        [CmdletBinding()]
        param(
            [Parameter(Mandatory=$true)]
            [string]$Fingerprint,

            [Parameter(Mandatory=$true)]
            [string]$FixDiff,

            [Parameter(Mandatory=$true)]
            [string]$FixDescription,

            [Parameter(Mandatory=$false)]
            [string]$DatabasePath
        )

        if (-not $DatabasePath) { $DatabasePath = Get-ForgeDbPath }

        $pattern = Get-FixPattern -Fingerprint $Fingerprint -DatabasePath $DatabasePath
        if (-not $pattern) {
            Write-Host "  [WARN] Cannot register fix — no pattern found for fingerprint $Fingerprint" -ForegroundColor Yellow
            return
        }

        $safeDiff = $FixDiff -replace "'", "''"
        $safeDesc = $FixDescription -replace "'", "''"
        $newApplied = [int]$pattern.times_fix_applied + 1
        $newSucceeded = [int]$pattern.times_fix_succeeded + 1
        $newRate = [math]::Round($newSucceeded / $newApplied, 4)

        Invoke-Sqlite -Database $DatabasePath -Query "UPDATE fix_patterns SET fix_diff = '$safeDiff', fix_description = '$safeDesc', times_fix_applied = $newApplied, times_fix_succeeded = $newSucceeded, success_rate = $newRate, last_seen = datetime('now') WHERE error_fingerprint = '$Fingerprint'"

        Write-Host "  [LEARN] Fix registered for $Fingerprint (success_rate=$newRate)" -ForegroundColor Cyan
    }
    ```

