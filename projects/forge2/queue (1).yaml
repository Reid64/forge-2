    ```powershell
    function New-GovernanceReconciliationReport {
        [CmdletBinding()]
        param(
            [Parameter(Mandatory=$true)][hashtable]$ScanReport,
            [Parameter(Mandatory=$true)][string]$ProjectPath
        )

        $unbuilt = @()
        $undocumented = @()

        # Check AGENTS.md for documented functions vs actual exports
        $agentsPath = Join-Path $ProjectPath 'AGENTS.md'
        if (Test-Path $agentsPath) {
            $agentsContent = Get-Content $agentsPath -Raw
            $documentedFunctions = [regex]::Matches($agentsContent, '(?:function|Function)\s+(\w+-\w+)') | ForEach-Object { $_.Groups[1].Value }

            # Get actual exported functions
            $actualFunctions = @()
            Get-ChildItem -Path (Join-Path $ProjectPath 'modules') -Filter '*.psm1' -ErrorAction SilentlyContinue | ForEach-Object {
                $content = Get-Content $_.FullName -Raw -ErrorAction SilentlyContinue
                $exports = [regex]::Matches($content, 'Export-ModuleMember\s+-Function\s+(.+)') | ForEach-Object {
                    $_.Groups[1].Value -split ',' | ForEach-Object { $_.Trim() }
                }
                $actualFunctions += $exports
            }

            foreach ($doc in $documentedFunctions) {
                if ($doc -notin $actualFunctions) { $unbuilt += @{ Name=$doc; Type='Function'; Status='UNBUILT' } }
            }
            foreach ($act in $actualFunctions) {
                if ($act -notin $documentedFunctions -and $act -notmatch 'TODO') {
                    $undocumented += @{ Name=$act; Type='Function'; Status='UNDOCUMENTED' }
                }
            }
        }

        $total = $unbuilt.Count + $undocumented.Count
        $score = if ($total -eq 0) { 100 } else { [math]::Round((1 - ($total / [math]::Max($unbuilt.Count + $undocumented.Count + 1, 1))) * 100) }

        $report = @"
    # Governance Reconciliation Report
    **Generated:** $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')
    **Reconciliation Score:** $score%

    ## UNBUILT (documented but not implemented): $($unbuilt.Count)
    $(if ($unbuilt.Count -gt 0) { ($unbuilt | ForEach-Object { "- $($_.Name) [BUILD/DEFER/ABANDON needed]" }) -join "`n" } else { 'None' })

    ## UNDOCUMENTED (implemented but not documented): $($undocumented.Count)
    $(if ($undocumented.Count -gt 0) { ($undocumented | ForEach-Object { "- $($_.Name) [Governance entry needed]" }) -join "`n" } else { 'None' })
    "@

        $reportPath = Join-Path $ProjectPath '.forge\GOVERNANCE_RECONCILIATION_REPORT.md'
        $forgeDir = Join-Path $ProjectPath '.forge'
        if (-not (Test-Path $forgeDir)) { New-Item -ItemType Directory -Path $forgeDir -Force | Out-Null }
        Set-Content $reportPath $report -Encoding UTF8

        return @{ UnbuiltFeatures=$unbuilt; UndocumentedFeatures=$undocumented; ReconciliationScore=$score; ReportPath=$reportPath }
    }
