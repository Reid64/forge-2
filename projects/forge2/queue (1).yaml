- id: r1-016
  name: "Hook System Condition Evaluation & Template Resolution"
  description: |
    You are building FORGE 2.0 at C:\Users\manag\Documents\FORGE 2.0\
    Implement Test-HookConditions and Resolve-HookTemplates in modules\ForgeHooks.psm1.

    These functions determine WHEN a hook fires (conditions) and resolve runtime values into hook action strings (templates).

    BEHAVIORAL CONTRACTS:
    - Conditions use AND logic — every present condition must pass for the hook to fire
    - Null/missing conditions = "not specified" = always pass (condition not evaluated)
    - Template resolution: unresolved placeholders left as-is (no error, no removal)

    === Test-HookConditions ===
    ```powershell
    function Test-HookConditions {
        [CmdletBinding()]
        param(
            [Parameter(Mandatory=$true)]
            [hashtable]$Hook,

            [Parameter(Mandatory=$true)]
            [hashtable]$Context
        )

        $conditions = $Hook.conditions
        if (-not $conditions) { return $true }  # No conditions = always fire

        # File pattern check (comma-separated globs)
        if ($conditions.file_pattern -and $Context.file) {
            $patterns = $conditions.file_pattern -split ',' | ForEach-Object { $_.Trim() }
            $fileMatches = $false
            foreach ($pattern in $patterns) {
                if ($Context.file -like $pattern) { $fileMatches = $true; break }
            }
            if (-not $fileMatches) { return $false }
        }

        # Exclude pattern check
        if ($conditions.exclude_pattern -and $Context.file) {
            $excludes = $conditions.exclude_pattern -split ',' | ForEach-Object { $_.Trim() }
            foreach ($exclude in $excludes) {
                if ($Context.file -like $exclude) { return $false }
            }
        }

        # Task type check
        if ($conditions.task_types -and $Context.task_type) {
            if ($Context.task_type -notin $conditions.task_types) { return $false }
        }

        # Minimum prompt number
        if ($conditions.min_prompt_number -and $Context.prompt_number) {
            if ([int]$Context.prompt_number -lt [int]$conditions.min_prompt_number) { return $false }
        }

        # Phase filter
        if ($conditions.phases -and $Context.phase) {
            if ($Context.phase -notin $conditions.phases) { return $false }
        }

        return $true
    }
    ```

    === Resolve-HookTemplates ===
    ```powershell
    function Resolve-HookTemplates {
        [CmdletBinding()]
        param(
            [Parameter(Mandatory=$true)]
            [string]$Action,

            [Parameter(Mandatory=$true)]
            [hashtable]$Context
        )

        $resolved = $Action
        foreach ($key in $Context.Keys) {
            $placeholder = "{{$key}}"
            if ($resolved.Contains($placeholder)) {
                $resolved = $resolved.Replace($placeholder, $Context[$key].ToString())
            }
        }
        return $resolved
    }
    ```

