- id: r1-043
  name: "DIAGNOSE Orchestrator with Adversarial Review"
  description: |
    You are building FORGE 2.0 at C:\Users\manag\Documents\FORGE 2.0\
    Replace Invoke-LightweightAdversarialReview and Invoke-RetrofitDiagnose stubs in modules\ForgeRetrofit.psm1 (#region DIAGNOSE).

    BEHAVIORAL CONTRACT: DIAGNOSE must run adversarial review on every Architecture Health Report — no skipping.

    ```powershell
    function Invoke-LightweightAdversarialReview {
        [CmdletBinding()]
        param(
            [Parameter(Mandatory=$true)][hashtable]$HealthReport,
            [Parameter(Mandatory=$false)][hashtable]$ScanReport
        )

        $challenges = @()
        $blindSpots = @()

        # Challenge 1: Is the score overly optimistic?
        if ($HealthReport.Score -gt 80 -and $HealthReport.CriticalCount -gt 0) {
            $challenges += "Score of $($HealthReport.Score) seems high with $($HealthReport.CriticalCount) CRITICAL issues present"
        }

        # Challenge 2: Areas not covered by SCAN
        $blindSpots += 'Runtime performance under load not tested'
        $blindSpots += 'Authentication/authorization flow not verified'
        $blindSpots += 'Data migration integrity not checked'
        if (-not $ScanReport -or -not $ScanReport.Results -or -not $ScanReport.Results.DynamicRoutes) {
            $blindSpots += 'Dynamic route testing was skipped'
        }

        # Challenge 3: Maturity assessment
        if ($HealthReport.MaturityStage -eq 'ENTERPRISE' -and $HealthReport.WarnCount -gt 5) {
            $challenges += "ENTERPRISE classification questionable with $($HealthReport.WarnCount) warnings"
        }

        # Revised score (adversary applies a skepticism factor)
        $skepticismPenalty = ($challenges.Count * 5) + ($blindSpots.Count * 2)
        $revisedScore = [math]::Max(0, $HealthReport.Score - $skepticismPenalty)

        Write-Host "  [ADVERSARY] $($challenges.Count) challenges, $($blindSpots.Count) blind spots, revised score: $revisedScore" -ForegroundColor $(if ($challenges.Count -gt 0) { 'Yellow' } else { 'Gray' })

        return @{ Challenges=$challenges; BlindSpots=$blindSpots; OriginalScore=$HealthReport.Score; RevisedScore=$revisedScore; ScoringValid=($challenges.Count -eq 0) }
    }

    function Invoke-RetrofitDiagnose {
        [CmdletBinding()]
        param(
            [Parameter(Mandatory=$true)][hashtable]$ScanReport,
            [Parameter(Mandatory=$true)][string]$ProjectPath
        )

        Write-Host "`n============================================" -ForegroundColor Cyan
        Write-Host "  FORGE RETROFIT DIAGNOSE" -ForegroundColor Cyan
        Write-Host "============================================`n" -ForegroundColor Cyan

        # Step 1: Format and display findings
        $findings = Format-ScanFindings -ScanReport $ScanReport
        foreach ($f in $findings) { Write-Finding -Finding $f }

        # Step 2: Health report
        $healthReport = New-ArchitectureHealthReport -ScanReport $ScanReport -Findings $findings -ProjectPath $ProjectPath

        # Step 3: MANDATORY adversarial review
        $adversary = Invoke-LightweightAdversarialReview -HealthReport $healthReport -ScanReport $ScanReport

        # Step 4: Governance reconciliation
        $govReport = New-GovernanceReconciliationReport -ScanReport $ScanReport -ProjectPath $ProjectPath

        # Step 5: Enterprise gap analysis
        $gapReport = New-EnterpriseGapReport -ScanReport $ScanReport -MaturityStage $healthReport.MaturityStage

        Write-Host "`n  === DIAGNOSE SUMMARY ===" -ForegroundColor Cyan
        Write-Host "  Maturity: $($healthReport.MaturityStage) | Health: $($adversary.RevisedScore)/100 (adversary-adjusted)" -ForegroundColor $(if ($healthReport.CriticalCount -gt 0) { 'Red' } else { 'Green' })
        Write-Host "  CRITICAL: $($healthReport.CriticalCount) | WARN: $($healthReport.WarnCount) | INFO: $($healthReport.InfoCount)" -ForegroundColor Gray

        return @{
            MaturityStage = $healthReport.MaturityStage
            CriticalCount = $healthReport.CriticalCount
            WarnCount = $healthReport.WarnCount
            InfoCount = $healthReport.InfoCount
            HealthScore = $adversary.RevisedScore
            AdversaryReview = $adversary
            Reports = @($healthReport.ReportPath, $govReport.ReportPath)
            Findings = $findings
        }
    }
    ```
