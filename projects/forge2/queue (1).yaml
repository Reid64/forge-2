  name: "Session Build Fingerprinting"
  description: |
    You are building FORGE 2.0 at C:\Users\manag\Documents\FORGE 2.0\
    Replace Get-BuildFingerprint and Test-FingerprintMatch stubs in modules\ForgeSession.psm1.
    Import ForgeLearning at top if not already.

    ```powershell
    function Get-BuildFingerprint {
        [CmdletBinding()]
        param([Parameter(Mandatory=$true)][string]$ProjectPath)

        $excludePattern = '\.forge[/\\]|node_modules|\.next|\.git[/\\]|dist[/\\]|build[/\\]|coverage|lib[/\\]'
        $files = Get-ChildItem -Path $ProjectPath -Recurse -File -Include *.ps1,*.psm1,*.md,*.json -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -notmatch $excludePattern } | Sort-Object FullName

        $sha256 = [System.Security.Cryptography.SHA256]::Create()
        $compositeBytes = [System.Text.Encoding]::UTF8.GetBytes('')

        foreach ($file in $files) {
            $relPath = $file.FullName.Replace($ProjectPath, '').TrimStart('\','/')
            $content = Get-Content $file.FullName -Raw -ErrorAction SilentlyContinue
            if (-not $content) { $content = '' }
            $fileHash = $sha256.ComputeHash([System.Text.Encoding]::UTF8.GetBytes("$relPath|$content"))
            $compositeBytes = $sha256.ComputeHash($compositeBytes + $fileHash)
        }

        $sha256.Dispose()
        return ($compositeBytes | ForEach-Object { $_.ToString('x2') }) -join ''
    }

    function Test-FingerprintMatch {
        [CmdletBinding()]
        param(
            [Parameter(Mandatory=$true)][string]$BuildId,
            [Parameter(Mandatory=$true)][string]$CurrentFingerprint,
            [Parameter(Mandatory=$false)][string]$DatabasePath
        )
        if (-not $DatabasePath) { $DatabasePath = Get-ForgeDbPath }
        $stored = Get-ForgeMemory -Table 'build_fingerprints' -Where "build_id = '$BuildId'" -OrderBy 'prompt_number DESC' -Limit 1 -DatabasePath $DatabasePath
        if ($stored.Count -eq 0) { return $false }
        return ($stored[0].fingerprint -eq $CurrentFingerprint)
    }
    ```
