    ```powershell
    function New-ArchitectureHealthReport {
        [CmdletBinding()]
        param(
            [Parameter(Mandatory=$true)][hashtable]$ScanReport,
            [Parameter(Mandatory=$true)][array]$Findings,
            [Parameter(Mandatory=$true)][string]$ProjectPath
        )

        $critical = @($Findings | Where-Object { $_.Severity -eq 'CRITICAL' }).Count
        $warn = @($Findings | Where-Object { $_.Severity -eq 'WARN' }).Count
        $info = @($Findings | Where-Object { $_.Severity -eq 'INFO' }).Count
        $maturity = if ($critical -gt 0) { 'FOUNDATION' } elseif ($warn -gt 0) { 'GROWTH' } else { 'ENTERPRISE' }

        # Health score: start at 100, deduct for issues
        $score = 100
        $score -= ($critical * 15)
        $score -= ($warn * 5)
        $score -= ($info * 1)
        if ($score -lt 0) { $score = 0 }

        $report = @"
    # Architecture Health Report
    **Generated:** $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')
    **Project:** $ProjectPath
    **Health Score:** $score / 100
    **Maturity Stage:** $maturity

    ## Issue Summary
    | Severity | Count |
    |----------|-------|
    | CRITICAL | $critical |
    | WARN | $warn |
    | INFO | $info |

    ## Findings by Category
    $(($Findings | Group-Object Category | ForEach-Object {
        "`n### $($_.Name)`n" + ($_.Group | ForEach-Object { "- [$($_.Severity)] $($_.Message)" }) -join "`n"
    }) -join "`n")

    ## Recommendations
    $(if ($critical -gt 0) { "1. **URGENT:** Fix $critical CRITICAL issues before any new development`n" })
    $(if ($warn -gt 0) { "2. Address $warn WARN issues to improve stability`n" })
    $(if ($maturity -eq 'FOUNDATION') { "3. Project is in FOUNDATION stage — focus on compilation and structural integrity`n" })
    "@

        $forgeDir = Join-Path $ProjectPath '.forge'
        if (-not (Test-Path $forgeDir)) { New-Item -ItemType Directory -Path $forgeDir -Force | Out-Null }
        Set-Content (Join-Path $forgeDir 'ARCHITECTURE_HEALTH_REPORT.md') $report -Encoding UTF8
        Write-Host "  [DIAGNOSE] Health report: score=$score, maturity=$maturity" -ForegroundColor $(if ($critical -gt 0) { 'Red' } elseif ($warn -gt 0) { 'Yellow' } else { 'Green' })

        return @{ Score=$score; MaturityStage=$maturity; CriticalCount=$critical; WarnCount=$warn; InfoCount=$info; ReportPath=(Join-Path $forgeDir 'ARCHITECTURE_HEALTH_REPORT.md') }
    }
    ```
