    Implement Sync-ForgeMemory in modules\ForgeSync.psm1.

    This function synchronizes learning data between the local forge_memory.db and the master copy on the 18TB external drive. Pull happens at SessionStart, Push at SessionEnd.

    BEHAVIORAL CONTRACTS (ForgeSync):
    - MUST use INSERT OR IGNORE to prevent duplicate records — never UPDATE master records
    - Push MUST acquire lock before writing to master, release in finally block
    - Pull does NOT acquire lock (read-only against master)
    - If master path unavailable: log WARN and return — NEVER fail a build because external drive isn't mounted
    - MUST NOT sync during a run — only at SessionStart (Pull) and SessionEnd (Push)

    ```powershell
    function Sync-ForgeMemory {
        [CmdletBinding()]
        param(
            [Parameter(Mandatory=$true)]
            [ValidateSet('Pull','Push')]
            [string]$Direction,

            [Parameter(Mandatory=$false)]
            [string]$LocalDbPath,

            [Parameter(Mandatory=$false)]
            [string]$MasterDbPath,

            [Parameter(Mandatory=$false)]
            [string]$LockPath
        )

        if (-not $LocalDbPath) { $LocalDbPath = Get-ForgeDbPath }

        $config = Get-SyncConfig
        if (-not $MasterDbPath) {
            $MasterDbPath = Join-Path $config.master_path 'forge_memory.db'
        }
        if (-not $LockPath) {
            $LockPath = Join-Path $config.master_path $config.lock_file
        }

        # Check if master is accessible
        $masterDir = Split-Path $MasterDbPath -Parent
        if (-not (Test-Path $masterDir)) {
            Write-Host "  [SYNC] Master path not available: $masterDir — skipping sync" -ForegroundColor Yellow
            return
        }

        # Initialize master DB if it doesn't exist
        if (-not (Test-Path $MasterDbPath)) {
            Write-Host "  [SYNC] Creating master database at $MasterDbPath" -ForegroundColor Cyan
            Initialize-ForgeMemory -DatabasePath $MasterDbPath
        }

        # Tables to sync (9 — excludes forge_meta, hook_execution_log, compact_snapshots, build_fingerprints, adversary_findings)
        $syncTables = @('prompt_scores','fix_patterns','decision_weights','governance_rules','pending_evolutions','build_outcomes','skill_library','reconcile_decisions','scan_reports')

        $lastSync = Get-LastSyncTimestamp -DatabasePath $LocalDbPath
        $whereClause = ""
        if ($lastSync) {
            $whereClause = " WHERE created_at > '$lastSync'"
        }

        $localMachineId = Get-MachineId

        if ($Direction -eq 'Pull') {
            Write-Host "  [SYNC] Pulling from master..." -ForegroundColor Cyan
            $totalPulled = 0
            foreach ($table in $syncTables) {
                $pullWhere = if ($lastSync) { " WHERE machine_id != '$localMachineId' AND created_at > '$lastSync'" } else { " WHERE machine_id != '$localMachineId'" }
                try {
                    $records = Invoke-Sqlite -Database $MasterDbPath -Query "SELECT * FROM $table$pullWhere"
                    if ($records -and $records.Count -gt 0) {
                        foreach ($record in $records) {
                            $columns = ($record.PSObject.Properties | ForEach-Object { $_.Name }) -join ', '
                            $values = ($record.PSObject.Properties | ForEach-Object {
                                $val = $_.Value
                                if ($null -eq $val) { 'NULL' }
                                elseif ($val -is [int] -or $val -is [long] -or $val -is [double]) { $val.ToString() }
                                else { "'" + ($val.ToString() -replace "'", "''") + "'" }
                            }) -join ', '
                            try {
                                Invoke-Sqlite -Database $LocalDbPath -Query "INSERT OR IGNORE INTO $table ($columns) VALUES ($values)"
                            } catch { }  # INSERT OR IGNORE — duplicates silently skipped
                        }
                        $totalPulled += $records.Count
                        Write-Host "    $table : $($records.Count) records pulled" -ForegroundColor Gray
                    }
                } catch {
                    Write-Host "    [WARN] Failed to pull $table : $($_.Exception.Message)" -ForegroundColor Yellow
                }
            }
            Set-LastSyncTimestamp -DatabasePath $LocalDbPath
            Write-Host "  [SYNC] Pull complete: $totalPulled total records" -ForegroundColor Green
        }
        elseif ($Direction -eq 'Push') {
            Write-Host "  [SYNC] Pushing to master..." -ForegroundColor Cyan
            $lockAcquired = Acquire-SyncLock -LockPath $LockPath
            if (-not $lockAcquired) {
                Write-Host "  [SYNC] Could not acquire lock — push skipped" -ForegroundColor Yellow
                return
            }
            try {
                $totalPushed = 0
                foreach ($table in $syncTables) {
                    $pushWhere = if ($lastSync) { " WHERE machine_id = '$localMachineId' AND created_at > '$lastSync'" } else { " WHERE machine_id = '$localMachineId'" }
                    try {
                        $records = Invoke-Sqlite -Database $LocalDbPath -Query "SELECT * FROM $table$pushWhere"
                        if ($records -and $records.Count -gt 0) {
                            foreach ($record in $records) {
                                $columns = ($record.PSObject.Properties | ForEach-Object { $_.Name }) -join ', '
                                $values = ($record.PSObject.Properties | ForEach-Object {
                                    $val = $_.Value
                                    if ($null -eq $val) { 'NULL' }
                                    elseif ($val -is [int] -or $val -is [long] -or $val -is [double]) { $val.ToString() }
                                    else { "'" + ($val.ToString() -replace "'", "''") + "'" }
                                }) -join ', '
                                try {
                                    Invoke-Sqlite -Database $MasterDbPath -Query "INSERT OR IGNORE INTO $table ($columns) VALUES ($values)"
                                } catch { }
                            }
                            $totalPushed += $records.Count
                            Write-Host "    $table : $($records.Count) records pushed" -ForegroundColor Gray
                        }
                    } catch {
                        Write-Host "    [WARN] Failed to push $table : $($_.Exception.Message)" -ForegroundColor Yellow
                    }
                }
                Set-LastSyncTimestamp -DatabasePath $LocalDbPath
                Write-Host "  [SYNC] Push complete: $totalPushed total records" -ForegroundColor Green
            }
            finally {
                Release-SyncLock -LockPath $LockPath
            }
        }
    }
    ```

