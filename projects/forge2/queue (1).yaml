    ```powershell
    function Invoke-ScanVercelAnalysis {
        [CmdletBinding()]
        param([Parameter(Mandatory=$true)][string]$ProjectPath)

        try {
            $vercelDir = Join-Path $ProjectPath '.vercel'
            if (-not (Test-Path $vercelDir)) {
                return @{ Status='SKIP'; Detail='No .vercel directory — project not linked' }
            }

            $whoami = & vercel whoami 2>$null
            if (-not $whoami) {
                return @{ Status='SKIP'; Detail='Vercel CLI not authenticated' }
            }

            return @{ Status='PASS'; LinkedUser=$whoami; Detail='Vercel project linked' }
        }
        catch {
            return @{ Status='SKIP'; Detail="Vercel CLI error: $($_.Exception.Message)" }
        }
    }

    function Complete-ScanReport {
        [CmdletBinding()]
        param(
            [Parameter(Mandatory=$true)]
            [hashtable]$Results
        )

        # Count issues by severity
        $criticalCount = 0; $warnCount = 0; $infoCount = 0

        # Count from broken imports
        if ($Results.BrokenImports) { $criticalCount += @($Results.BrokenImports).Count }

        # Count from dead files
        if ($Results.DeadFiles) { $warnCount += @($Results.DeadFiles).Count }

        # Count from env audit
        if ($Results.EnvAudit -and $Results.EnvAudit.Issues) {
            foreach ($issue in $Results.EnvAudit.Issues) {
                switch ($issue.Severity) {
                    'CRITICAL' { $criticalCount++ }
                    'WARN' { $warnCount++ }
                    'INFO' { $infoCount++ }
                }
            }
        }

        # Count from schema
        if ($Results.DbSchema -and $Results.DbSchema.Issues) {
            foreach ($issue in $Results.DbSchema.Issues) {
                switch ($issue.Severity) {
                    'CRITICAL' { $criticalCount++ }
                    'WARN' { $warnCount++ }
                }
            }
        }

        # Count from TSC
        if ($Results.TscCheck -and $Results.TscCheck.Status -eq 'FAIL') {
            $criticalCount += $Results.TscCheck.ErrorCount
        }

        # Count from dynamic routes
        if ($Results.DynamicRoutes -and $Results.DynamicRoutes.Results) {
            $criticalCount += @($Results.DynamicRoutes.Results | Where-Object { $_.Severity -eq 'CRITICAL' }).Count
        }

        $report = @{
            CriticalCount = $criticalCount
            WarnCount = $warnCount
            InfoCount = $infoCount
            TotalIssues = $criticalCount + $warnCount + $infoCount
            Results = $Results
            GeneratedAt = (Get-Date -Format 'o')
        }

        # Determine maturity stage
        $report['MaturityStage'] = if ($criticalCount -gt 0) { 'FOUNDATION' }
                                    elseif ($warnCount -gt 0) { 'GROWTH' }
                                    else { 'ENTERPRISE' }

        Write-Host "`n  === SCAN SUMMARY ===" -ForegroundColor Cyan
        Write-Host "  CRITICAL: $criticalCount | WARN: $warnCount | INFO: $infoCount" -ForegroundColor $(if ($criticalCount -gt 0) { 'Red' } elseif ($warnCount -gt 0) { 'Yellow' } else { 'Green' })
        Write-Host "  Maturity Stage: $($report.MaturityStage)" -ForegroundColor Cyan

        return $report
    }
    ```

