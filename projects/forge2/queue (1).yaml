    function Resume-ForgeSession {
        [CmdletBinding()]
        param([Parameter(Mandatory=$true)][string]$ProjectPath)

        $state = Import-SessionState -ProjectPath $ProjectPath
        if (-not $state) {
            Write-Host "  [SESSION] No previous session found" -ForegroundColor Yellow
            return $null
        }

        Write-Host "`n  === Session Resume ===" -ForegroundColor Cyan
        Write-Host "  Build: $($state.build_id)" -ForegroundColor Gray
        Write-Host "  Project: $($state.project_name)" -ForegroundColor Gray
        Write-Host "  Last serialized: $($state.serialized_at)" -ForegroundColor Gray
        Write-Host "  Machine: $($state.machine_id)" -ForegroundColor Gray

        # Check staleness
        if ($state.serialized_at) {
            $age = (Get-Date) - [datetime]$state.serialized_at
            if ($age.TotalHours -gt 24) {
                Write-Host "  [WARN] Session is $([math]::Round($age.TotalHours, 1)) hours old" -ForegroundColor Yellow
            }
        }

        # Verify fingerprint
        $currentFp = Get-BuildFingerprint -ProjectPath $ProjectPath
        if ($state.build_fingerprint -and $state.build_fingerprint -ne $currentFp) {
            Write-Host "  [WARN] Build fingerprint MISMATCH — files changed since last session" -ForegroundColor Yellow
            return @{ CanResume=$false; State=$state; Reason='FINGERPRINT_MISMATCH'; CurrentFingerprint=$currentFp; StoredFingerprint=$state.build_fingerprint }
        }

        Write-Host "  [SESSION] Fingerprint match — safe to resume" -ForegroundColor Green
        return @{ CanResume=$true; State=$state; NextPrompt=$state.next_prompt }
    }
