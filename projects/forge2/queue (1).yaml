    === Export-BuildReport ===
    ```powershell
    function Export-BuildReport {
        [CmdletBinding()]
        param(
            [Parameter(Mandatory=$true)]
            [string]$ProjectPath
        )

        if (-not $Global:ForgeBuildTracker) {
            Write-Host "  [WARN] No build tracker data to report" -ForegroundColor Yellow
            return
        }

        $tracker = $Global:ForgeBuildTracker
        $forgeDir = Join-Path $ProjectPath '.forge'
        if (-not (Test-Path $forgeDir)) { New-Item -ItemType Directory -Path $forgeDir -Force | Out-Null }

        $results = $tracker.Results
        $totalPrompts = $results.Count
        $passed = ($results | Where-Object { $_.Status -eq 'PASS' }).Count
        $failed = ($results | Where-Object { $_.Status -eq 'FAIL' }).Count
        $skipped = ($results | Where-Object { $_.Status -eq 'SKIP' }).Count
        $totalTokens = ($results | Measure-Object -Property Tokens -Sum).Sum
        $totalDuration = ($results | Measure-Object -Property Duration -Sum).Sum
        $firstPassRate = if ($totalPrompts -gt 0) { [math]::Round(($results | Where-Object { $_.Attempts -eq 1 -and $_.Status -eq 'PASS' }).Count / $totalPrompts * 100, 1) } else { 0 }

        $report = @"
    # FORGE 2.0 Build Report

    **Build ID:** $($tracker.BuildId)
    **Project:** $($tracker.ProjectName)
    **Started:** $($tracker.StartTime.ToString('yyyy-MM-dd HH:mm:ss'))
    **Completed:** $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')
    **Duration:** $([math]::Round($totalDuration / 60, 1)) minutes

    ## Summary

    | Metric | Value |
    |--------|-------|
    | Total Prompts | $totalPrompts |
    | Passed | $passed |
    | Failed | $failed |
    | Skipped | $skipped |
    | First-Pass Rate | $firstPassRate% |
    | Total Tokens | $($totalTokens.ToString('N0')) |

    ## Per-Prompt Results

    | Prompt | Status | Attempts | Tokens | Duration |
    |--------|--------|----------|--------|----------|
    $(($results | ForEach-Object { "| $($_.PromptId) | $($_.Status) | $($_.Attempts) | $($_.Tokens.ToString('N0')) | $($_.Duration)s |" }) -join "`n")

    "@

        $reportPath = Join-Path $forgeDir 'BUILD_REPORT.md'
        Set-Content -Path $reportPath -Value $report -Encoding UTF8
        Write-Host "  [BUILD] Report saved to $reportPath" -ForegroundColor Green
    }
    ```

