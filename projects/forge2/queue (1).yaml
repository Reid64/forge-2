    ```powershell
    function New-EnterpriseGapReport {
        [CmdletBinding()]
        param(
            [Parameter(Mandatory=$true)][hashtable]$ScanReport,
            [Parameter(Mandatory=$true)][string]$MaturityStage
        )

        $patterns = @(
            @{ Name='Error Handling'; Foundation='SKIP'; Growth='CHECK'; Enterprise='REQUIRE'; Detect='try\s*\{|catch\s*\{|ErrorAction' }
            @{ Name='Input Validation'; Foundation='CHECK'; Growth='REQUIRE'; Enterprise='REQUIRE'; Detect='Mandatory.*\$true|ValidateSet|ValidatePattern|ValidateRange' }
            @{ Name='Structured Logging'; Foundation='SKIP'; Growth='CHECK'; Enterprise='REQUIRE'; Detect='Write-Host.*\[.*\]|ConvertTo-Json.*\|.*Set-Content' }
            @{ Name='Test Coverage'; Foundation='SKIP'; Growth='CHECK'; Enterprise='REQUIRE'; Detect='Describe\s|It\s.*Should|\.Tests\.ps1' }
            @{ Name='Configuration Management'; Foundation='CHECK'; Growth='REQUIRE'; Enterprise='REQUIRE'; Detect='forge_config\.json|ConvertFrom-Json.*config' }
            @{ Name='Git Integration'; Foundation='CHECK'; Growth='REQUIRE'; Enterprise='REQUIRE'; Detect='git\s+(add|commit|tag|push)' }
            @{ Name='Database Migrations'; Foundation='SKIP'; Growth='CHECK'; Enterprise='REQUIRE'; Detect='CREATE TABLE|ALTER TABLE|migration' }
            @{ Name='Security Scanning'; Foundation='SKIP'; Growth='SKIP'; Enterprise='CHECK'; Detect='gitleaks|security|secrets' }
        )

        $results = @()
        # Check each pattern against project files
        $allContent = ''
        Get-ChildItem -Path (Join-Path (Split-Path $ScanReport.ProjectPath -ErrorAction SilentlyContinue) 'modules') -Filter '*.psm1' -ErrorAction SilentlyContinue | ForEach-Object {
            $allContent += (Get-Content $_.FullName -Raw -ErrorAction SilentlyContinue)
        }
        if (-not $allContent -and $ScanReport.ProjectPath) {
            Get-ChildItem -Path $ScanReport.ProjectPath -Recurse -Include *.ps1,*.psm1,*.ts,*.tsx -ErrorAction SilentlyContinue |
                Where-Object { $_.FullName -notmatch 'node_modules|\.next' } | ForEach-Object {
                $allContent += (Get-Content $_.FullName -Raw -ErrorAction SilentlyContinue)
            }
        }

        foreach ($pattern in $patterns) {
            $requirement = $pattern[$MaturityStage]
            if ($requirement -eq 'SKIP') { continue }

            $present = if ($allContent -and $pattern.Detect) { $allContent -match $pattern.Detect } else { $false }
            $severity = if ($requirement -eq 'REQUIRE' -and -not $present) { 'CRITICAL' } elseif ($requirement -eq 'CHECK' -and -not $present) { 'WARN' } else { 'PASS' }

            $results += @{
                PatternName = $pattern.Name
                MaturityStage = $MaturityStage
                Requirement = $requirement
                Present = $present
                Severity = $severity
                Recommendation = if (-not $present) { "Implement $($pattern.Name) pattern" } else { 'Pattern detected' }
            }
        }

        return $results
    }
