    ```powershell
    function Invoke-PreFlightChecks {
        [CmdletBinding()]
        param(
            [Parameter(Mandatory=$true)]
            [string]$ProjectPath
        )

        Write-Host "`n=== RETROFIT Pre-Flight Checks ===" -ForegroundColor Cyan
        $results = @()

        # Check 1: Project path exists
        $check1 = @{ Name='ProjectPath'; Status='PASS'; Detail=$ProjectPath }
        if (-not (Test-Path $ProjectPath)) { $check1.Status = 'FAIL'; $check1.Detail = "Path not found: $ProjectPath" }
        $results += $check1

        # Check 2: Git initialized
        $gitDir = Join-Path $ProjectPath '.git'
        $check2 = @{ Name='GitRepository'; Status='PASS'; Detail='Git initialized' }
        if (-not (Test-Path $gitDir)) {
            Push-Location $ProjectPath
            try { git init 2>$null; git add -A 2>$null; git commit -m 'FORGE init' --allow-empty 2>$null }
            finally { Pop-Location }
            $check2.Detail = 'Git initialized (auto-created)'
            $check2.Status = 'WARN'
        }
        $results += $check2

        # Check 3: package.json exists
        $check3 = @{ Name='PackageJson'; Status='PASS'; Detail='Found' }
        if (-not (Test-Path (Join-Path $ProjectPath 'package.json'))) { $check3.Status = 'WARN'; $check3.Detail = 'Not found — not a Node.js project' }
        $results += $check3

        # Check 4: node_modules exists
        $check4 = @{ Name='NodeModules'; Status='PASS'; Detail='Present' }
        if (-not (Test-Path (Join-Path $ProjectPath 'node_modules'))) { $check4.Status = 'WARN'; $check4.Detail = 'Not installed — run npm install' }
        $results += $check4

        # Check 5: Environment file
        $check5 = @{ Name='EnvFile'; Status='PASS'; Detail='.env.local found' }
        $envFiles = @('.env.local', '.env', '.env.development') | Where-Object { Test-Path (Join-Path $ProjectPath $_) }
        if ($envFiles.Count -eq 0) { $check5.Status = 'WARN'; $check5.Detail = 'No .env file found' }
        else { $check5.Detail = "Found: $($envFiles -join ', ')" }
        $results += $check5

        # Check 6: tsconfig.json
        $check6 = @{ Name='TypeScript'; Status='PASS'; Detail='tsconfig.json found' }
        if (-not (Test-Path (Join-Path $ProjectPath 'tsconfig.json'))) { $check6.Status = 'INFO'; $check6.Detail = 'No tsconfig.json — JavaScript project or non-web' }
        $results += $check6

        # Check 7: Database config (Supabase)
        $check7 = @{ Name='DatabaseConfig'; Status='PASS'; Detail='Supabase config detected' }
        if (-not (Test-Path (Join-Path $ProjectPath 'supabase'))) { $check7.Status = 'WARN'; $check7.Detail = 'No supabase directory' }
        $results += $check7

        # Check 8: Learning database
        $check8 = @{ Name='LearningDb'; Status='PASS'; Detail='forge_memory.db accessible' }
        $dbPath = Get-ForgeDbPath
        if (-not (Test-Path $dbPath)) {
            try {
                Initialize-ForgeMemory -DatabasePath $dbPath
                $check8.Detail = 'Created forge_memory.db'
            } catch {
                $check8.Status = 'WARN'
                $check8.Detail = "Could not create: $($_.Exception.Message)"
            }
        }
        $results += $check8

        # Display results
        foreach ($r in $results) {
            $color = switch ($r.Status) { 'PASS' { 'Green' } 'WARN' { 'Yellow' } 'INFO' { 'Cyan' } 'FAIL' { 'Red' } }
            Write-Host "  [$($r.Status)] $($r.Name): $($r.Detail)" -ForegroundColor $color
        }

        # Halt on FAIL
        $failures = @($results | Where-Object { $_.Status -eq 'FAIL' })
        if ($failures.Count -gt 0) {
            Write-Host "`n  FATAL: $($failures.Count) pre-flight check(s) failed — cannot continue" -ForegroundColor Red
            throw "Pre-flight failed: $($failures[0].Detail)"
        }

        Write-Host "`n  Pre-flight complete: $($results.Count) checks" -ForegroundColor Green
        return $results
    }
