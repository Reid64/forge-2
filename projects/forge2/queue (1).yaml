        Get-ChildItem -Path $appDir -Recurse -Include 'layout.tsx','layout.ts' -ErrorAction SilentlyContinue | ForEach-Object {
            $scope = $_.DirectoryName.Replace($appDir, '').Replace('\', '/')
            if (-not $scope) { $scope = '/' }
            $layouts += @{ Scope=$scope; File=$_.FullName }
        }

        Write-Host "  Pages: $($pageRoutes.Count) | APIs: $($apiRoutes.Count) | Middleware: $($middleware.Count) | Layouts: $($layouts.Count)" -ForegroundColor Gray

