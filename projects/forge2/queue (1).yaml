            [string]$ProjectPath
        )

        $appDir = Join-Path $ProjectPath 'app'
        if (-not (Test-Path $appDir)) {
            Write-Host "  No app/ directory — skipping route inventory" -ForegroundColor Yellow
            return @{ PageRoutes=@(); ApiRoutes=@(); Middleware=@(); Layouts=@(); TotalPages=0; TotalAPIs=0 }
        }

        # Page routes
        $pageRoutes = @()
        Get-ChildItem -Path $appDir -Recurse -Include 'page.tsx','page.ts','page.jsx','page.js' -ErrorAction SilentlyContinue | ForEach-Object {
            $route = $_.DirectoryName.Replace($appDir, '').Replace('\', '/')
            if (-not $route) { $route = '/' }
            $pageRoutes += @{ Route=$route; File=$_.FullName; Type='PAGE' }
        }

        # API routes with method detection
        $apiRoutes = @()
        Get-ChildItem -Path $appDir -Recurse -Include 'route.ts','route.js' -ErrorAction SilentlyContinue | ForEach-Object {
            $route = $_.DirectoryName.Replace($appDir, '').Replace('\', '/')
            $content = Get-Content $_.FullName -Raw -ErrorAction SilentlyContinue
            $methods = @()
            foreach ($method in @('GET','POST','PUT','DELETE','PATCH','HEAD','OPTIONS')) {
                if ($content -match "export\s+(?:async\s+)?function\s+$method") { $methods += $method }
            }
            $apiRoutes += @{ Route=$route; File=$_.FullName; Methods=$methods; Type='API' }
        }

        # Middleware
        $middleware = @()
        Get-ChildItem -Path $ProjectPath -Include 'middleware.ts','middleware.js' -ErrorAction SilentlyContinue | ForEach-Object {
            $middleware += @{ File=$_.FullName; Scope='root' }
        }

        # Layouts
