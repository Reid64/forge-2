    function Invoke-RetrofitScan {
        [CmdletBinding()]
        param(
            [Parameter(Mandatory=$true)]
            [string]$ProjectPath,

            [ValidateSet('A','B','C')]
            [string]$Scope = 'A',

            [switch]$SkipDynamic,
            [switch]$Resume
        )

        Write-Host "`n============================================" -ForegroundColor Cyan
        Write-Host "  FORGE RETROFIT SCAN — Scope $Scope" -ForegroundColor Cyan
        Write-Host "  Target: $ProjectPath" -ForegroundColor Gray
        Write-Host "============================================`n" -ForegroundColor Cyan

        # Phase 1: Pre-flight
        $preFlightResults = Invoke-PreFlightChecks -ProjectPath $ProjectPath

        $sw = [System.Diagnostics.Stopwatch]::StartNew()
        $scanResults = @{}

        # Phase 2: Run scan operations based on scope
        # Op 1: Directory Tree (all scopes)
        Write-Host "`n--- Op 1: Directory Tree ---" -ForegroundColor Cyan
        $scanResults['DirectoryTree'] = Invoke-ScanDirectoryTree -ProjectPath $ProjectPath

        # Op 2: Dependency Tree (all scopes)
        Write-Host "`n--- Op 2: Dependency Tree ---" -ForegroundColor Cyan
        $scanResults['DependencyTree'] = Invoke-ScanDependencyTree -ProjectPath $ProjectPath

        # Op 3-4: Broken Imports & Dead Files (all scopes)
        Write-Host "`n--- Op 3-4: Import & Dead File Analysis ---" -ForegroundColor Cyan
        $scanResults['BrokenImports'] = Invoke-ScanBrokenImports -DependencyGraph $scanResults['DependencyTree'] -ProjectPath $ProjectPath
        $scanResults['DeadFiles'] = Invoke-ScanDeadFiles -DependencyGraph $scanResults['DependencyTree'] -ProjectPath $ProjectPath

        if ($Scope -in @('A','B')) {
            # Op 5: Route Inventory
            Write-Host "`n--- Op 5: Route Inventory ---" -ForegroundColor Cyan
            $scanResults['RouteInventory'] = Invoke-ScanRouteInventory -ProjectPath $ProjectPath

            # Op 6: Env Audit
            Write-Host "`n--- Op 6: Environment Variables ---" -ForegroundColor Cyan
            $scanResults['EnvAudit'] = Invoke-ScanEnvAudit -ProjectPath $ProjectPath

            # Op 7: Schema
            Write-Host "`n--- Op 7: Database Schema ---" -ForegroundColor Cyan
            $scanResults['DbSchema'] = Invoke-ScanDbSchema -ProjectPath $ProjectPath

            # Op 8-10: Git, Package, Governance
            Write-Host "`n--- Op 8-10: Git, Packages, Governance ---" -ForegroundColor Cyan
            $scanResults['GitHistory'] = Invoke-ScanGitHistory -ProjectPath $ProjectPath
            $scanResults['PackageAudit'] = Invoke-ScanPackageAudit -ProjectPath $ProjectPath
            $scanResults['Governance'] = Invoke-ScanGovernance -ProjectPath $ProjectPath
        }

        if ($Scope -eq 'A') {
            # Op 11-12: TSC & Tests
            Write-Host "`n--- Op 11-12: Compilation & Tests ---" -ForegroundColor Cyan
            $scanResults['TscCheck'] = Invoke-ScanTscCheck -ProjectPath $ProjectPath
            $scanResults['TestExecution'] = Invoke-ScanTestExecution -ProjectPath $ProjectPath

            # Op 13: Dynamic Routes
            Write-Host "`n--- Op 13: Dynamic Route Testing ---" -ForegroundColor Cyan
            $scanResults['DynamicRoutes'] = Invoke-ScanDynamicRoutes -ProjectPath $ProjectPath -Routes @() -SkipDynamic:$SkipDynamic

            # Op 14: Vercel
            Write-Host "`n--- Op 14: Vercel Analysis ---" -ForegroundColor Cyan
            $scanResults['VercelAnalysis'] = Invoke-ScanVercelAnalysis -ProjectPath $ProjectPath
        }

        $sw.Stop()

        # Assemble report
        $report = Complete-ScanReport -Results $scanResults
        $report['ScanDuration'] = $sw.ElapsedMilliseconds
        $report['Scope'] = $Scope
        $report['ProjectPath'] = $ProjectPath
        $report['Timestamp'] = (Get-Date -Format 'o')

        Write-Host "`n  SCAN complete in $([math]::Round($sw.ElapsedMilliseconds / 1000, 1))s" -ForegroundColor Green
        return $report
    }
