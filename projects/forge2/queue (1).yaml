  name: "SCAN Op 13 Dynamic Route Testing"
  description: |
    You are building FORGE 2.0 at C:\Users\manag\Documents\FORGE 2.0\
    Replace Invoke-ScanDynamicRoutes stub in modules\ForgeRetrofit.psm1 (#region SCAN).

    ```powershell
    function Invoke-ScanDynamicRoutes {
        [CmdletBinding()]
        param(
            [Parameter(Mandatory=$true)][string]$ProjectPath,
            [Parameter(Mandatory=$false)][array]$Routes = @(),
            [Parameter(Mandatory=$false)][bool]$SkipDynamic = $false
        )

        if ($SkipDynamic) {
            Write-Host "  Dynamic route testing: SKIPPED" -ForegroundColor Yellow
            return @{ Status='SKIP'; Results=@(); ServerStarted=$false; Duration=0 }
        }

        if ($Routes.Count -eq 0) {
            return @{ Status='SKIP'; Results=@(); ServerStarted=$false; Duration=0; Detail='No routes to test' }
        }

        $port = 3099
        $devProcess = $null
        $sw = [System.Diagnostics.Stopwatch]::StartNew()
        $results = @()

        try {
            # Start dev server
            Push-Location $ProjectPath
            $devProcess = Start-Process -FilePath 'npx' -ArgumentList 'next','dev','--port',$port -PassThru -NoNewWindow -RedirectStandardOutput (Join-Path $env:TEMP 'forge_dev_stdout.log') -RedirectStandardError (Join-Path $env:TEMP 'forge_dev_stderr.log')

            # Poll until ready (max 60 seconds)
            $ready = $false
            $waited = 0
            while ($waited -lt 60 -and -not $ready) {
                Start-Sleep -Seconds 2
                $waited += 2
                try {
                    $response = Invoke-WebRequest -Uri "http://localhost:$port" -TimeoutSec 3 -ErrorAction Stop
                    if ($response.StatusCode -eq 200) { $ready = $true }
                } catch { }
            }

            if (-not $ready) {
                $sw.Stop()
                return @{ Status='FAIL'; Results=@(); ServerStarted=$false; Duration=$sw.ElapsedMilliseconds; Detail="Dev server did not start within 60s" }
            }

            # Hit each route
            foreach ($route in $Routes) {
                $routePath = if ($route -is [hashtable]) { $route.Route } else { $route }
                if ($routePath -match '\[') { continue }  # Skip dynamic segments

                try {
                    $resp = Invoke-WebRequest -Uri "http://localhost:$port$routePath" -TimeoutSec 10 -ErrorAction Stop
                    $severity = switch ($resp.StatusCode) {
                        200 { 'PASS' }; 301 { 'PASS' }; 302 { 'PASS' }
                        401 { 'INFO' }; 403 { 'INFO' }
                        404 { 'WARN' }; 500 { 'CRITICAL' }
                        default { 'WARN' }
                    }
                    $results += @{ Route=$routePath; StatusCode=$resp.StatusCode; Severity=$severity }
                } catch {
                    $results += @{ Route=$routePath; StatusCode=0; Severity='WARN'; Error=$_.Exception.Message }
                }
            }
        }
        catch {
            Write-Host "  [WARN] Dynamic testing error: $($_.Exception.Message)" -ForegroundColor Yellow
        }
        finally {
            if ($devProcess -and -not $devProcess.HasExited) {
                Stop-Process -Id $devProcess.Id -Force -ErrorAction SilentlyContinue
            }
            Pop-Location -ErrorAction SilentlyContinue
        }

        $sw.Stop()
        $critical = ($results | Where-Object { $_.Severity -eq 'CRITICAL' }).Count
        Write-Host "  Routes tested: $($results.Count) | Critical: $critical | Time: $([math]::Round($sw.ElapsedMilliseconds/1000,1))s" -ForegroundColor $(if ($critical -gt 0) { 'Red' } else { 'Green' })

        return @{ Status=if($critical -gt 0){'FAIL'}else{'PASS'}; Results=$results; ServerStarted=$true; Duration=$sw.ElapsedMilliseconds }
    }
    ```

