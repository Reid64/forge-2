- id: r1-022
  name: "SCAN Op 2 Dependency Tree Mapping"
  description: |
    You are building FORGE 2.0 at C:\Users\manag\Documents\FORGE 2.0\
    Replace the Invoke-ScanDependencyTree stub in modules\ForgeRetrofit.psm1 (#region SCAN).

    This parses JavaScript/TypeScript files for import/export statements and builds a directed dependency graph. It analyzes TARGET projects (Next.js/TypeScript codebases), not FORGE itself.

    ```powershell
    function Invoke-ScanDependencyTree {
        [CmdletBinding()]
        param(
            [Parameter(Mandatory=$true)]
            [string]$ProjectPath
        )

        $sw = [System.Diagnostics.Stopwatch]::StartNew()
        $jsFiles = Get-ChildItem -Path $ProjectPath -Recurse -Include *.ts,*.tsx,*.js,*.jsx -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -notmatch 'node_modules|\.next|dist|build|coverage' }

        $nodes = @{}
        $edges = @()

        # Import regex patterns
        $importPatterns = @(
            "(?:import\s+.*?from\s+[`"']([^`"']+)[`"'])"       # ES6 imports
            "(?:require\s*\(\s*[`"']([^`"']+)[`"']\s*\))"       # CommonJS require
            "(?:import\s*\(\s*[`"']([^`"']+)[`"']\s*\))"        # Dynamic import
        )

        # Export regex patterns
        $exportPatterns = @(
            'export\s+(?:async\s+)?function\s+(\w+)'             # export function Name
            'export\s+(?:const|let|var)\s+(\w+)'                 # export const Name
            'export\s+default'                                    # export default
            'export\s*\{([^}]+)\}'                               # export { A, B }
        )

        foreach ($file in $jsFiles) {
            $relPath = $file.FullName.Replace($ProjectPath, '').TrimStart('\', '/')
            $content = Get-Content $file.FullName -Raw -ErrorAction SilentlyContinue
            if (-not $content) { continue }

            # Extract exports
            $exports = @()
            foreach ($pattern in $exportPatterns) {
                $matches = [regex]::Matches($content, $pattern)
                foreach ($m in $matches) {
                    if ($m.Groups[1].Success) {
                        $exportNames = $m.Groups[1].Value -split ',' | ForEach-Object { $_.Trim() -replace '\s+as\s+\w+', '' }
                        $exports += $exportNames
                    }
                    if ($m.Value -match 'export\s+default') { $exports += 'default' }
                }
            }

            $nodes[$relPath] = @{ Path = $relPath; Exports = ($exports | Select-Object -Unique); ImportCount = 0; DependencyCount = 0 }

            # Extract imports
            foreach ($pattern in $importPatterns) {
                $matches = [regex]::Matches($content, $pattern)
                foreach ($m in $matches) {
                    $importPath = $null
                    for ($g = 1; $g -le $m.Groups.Count - 1; $g++) {
                        if ($m.Groups[$g].Success -and $m.Groups[$g].Value) {
                            $importPath = $m.Groups[$g].Value
                            break
                        }
                    }
                    if (-not $importPath) { continue }

                    $isRelative = $importPath.StartsWith('.') -or $importPath.StartsWith('/')
                    $edges += @{
                        Source = $relPath
                        Target = $importPath
                        IsRelative = $isRelative
                        IsExternal = (-not $isRelative)
                    }
                    $nodes[$relPath].ImportCount++
                }
            }
        }

        # Resolve relative imports
        foreach ($edge in $edges) {
            if ($edge.IsRelative) {
                $sourceDir = Split-Path $edge.Source -Parent
                $candidates = @(
                    (Join-Path $sourceDir "$($edge.Target).ts"),
                    (Join-Path $sourceDir "$($edge.Target).tsx"),
                    (Join-Path $sourceDir "$($edge.Target).js"),
                    (Join-Path $sourceDir "$($edge.Target).jsx"),
                    (Join-Path $sourceDir $edge.Target 'index.ts'),
                    (Join-Path $sourceDir $edge.Target 'index.tsx')
                ) | ForEach-Object { $_ -replace '\\', '/' -replace '^\./', '' }

                $resolved = $candidates | Where-Object { $_ -in $nodes.Keys } | Select-Object -First 1
                if ($resolved) {
                    $edge['ResolvedTarget'] = $resolved
                    if ($nodes.ContainsKey($resolved)) { $nodes[$resolved].DependencyCount++ }
                }
            }
        }

        $sw.Stop()
        Write-Host "  Nodes: $($nodes.Count) | Edges: $($edges.Count) | External: $(($edges | Where-Object { $_.IsExternal }).Count) | Time: $($sw.ElapsedMilliseconds)ms" -ForegroundColor Gray

        return @{
            Nodes = $nodes
            Edges = $edges
            TotalFiles = $nodes.Count
            TotalImports = $edges.Count
            ExternalPackages = ($edges | Where-Object { $_.IsExternal } | ForEach-Object { $_.Target } | Select-Object -Unique)
            CircularDeps = @()  # Placeholder — DFS cycle detection deferred
            Duration = $sw.ElapsedMilliseconds
        }
    }
    ```

