- id: r1-019
  name: "Hook System PreCompact & Context Re-injection"
  description: |
    You are building FORGE 2.0 at C:\Users\manag\Documents\FORGE 2.0\
    Implement Invoke-PreCompactSave and Restore-CompactedContext in modules\ForgeHooks.psm1.

    These functions manage context preservation across Claude's context window compaction events. When FORGE detects it's at ~80% of the queue, it saves critical state so it can be recovered after compaction.

    ```powershell
    function Invoke-PreCompactSave {
        [CmdletBinding()]
        param(
            [Parameter(Mandatory=$true)]
            [string]$BuildId,

            [Parameter(Mandatory=$true)]
            [int]$PromptIndex,

            [Parameter(Mandatory=$true)]
            [hashtable]$State,

            [Parameter(Mandatory=$false)]
            [string]$DatabasePath
        )

        if (-not $DatabasePath) { $DatabasePath = Get-ForgeDbPath }

        $stateJson = $State | ConvertTo-Json -Depth 10 -Compress

        Save-ToForgeMemory -Table 'compact_snapshots' -Data @{
            build_id = $BuildId
            prompt_index = $PromptIndex
            state_json = $stateJson
        } -DatabasePath $DatabasePath

        Write-Host "  [COMPACT] Saved context snapshot at prompt $PromptIndex for build $BuildId" -ForegroundColor Cyan
    }

    function Restore-CompactedContext {
        [CmdletBinding()]
        param(
            [Parameter(Mandatory=$true)]
            [string]$BuildId,

            [Parameter(Mandatory=$false)]
            [string]$DatabasePath
        )

        if (-not $DatabasePath) { $DatabasePath = Get-ForgeDbPath }

        $snapshots = Get-ForgeMemory -Table 'compact_snapshots' -Where "build_id = '$BuildId'" -OrderBy 'prompt_index DESC' -Limit 1 -DatabasePath $DatabasePath

        if ($snapshots.Count -eq 0) {
            Write-Host "  [COMPACT] No snapshot found for build $BuildId" -ForegroundColor Yellow
            return $null
        }

        $snapshot = $snapshots[0]
        try {
            $state = $snapshot.state_json | ConvertFrom-Json
            Write-Host "  [COMPACT] Restored context from prompt $($snapshot.prompt_index)" -ForegroundColor Cyan
            return $state
        }
        catch {
            Write-Host "  [COMPACT] Failed to deserialize snapshot: $($_.Exception.Message)" -ForegroundColor Red
            return $null
        }
    }
    ```

