  description: |
    You are building FORGE 2.0 at C:\Users\manag\Documents\FORGE 2.0\
    Implement six write functions in modules\ForgeLearning.psm1. Replace the existing stubs.

    BEHAVIORAL CONTRACTS:
    - ConvertTo-Json -Depth 10 for ALL JSON serialization
    - UUIDs via [guid]::NewGuid().ToString() on every INSERT
    - ISO 8601 timestamps via (Get-Date -Format 'o') for created_at
    - machine_id via Get-MachineId on every database write
    - All database operations via Invoke-Sqlite — never raw SQLite
    - Append-only database — never DELETE FROM without WHERE, never DROP TABLE
    - Every catch must re-throw, log via Register-Error, or write visible message — never silent

    === FUNCTION 1: Save-ToForgeMemory ===
    Generic insert that auto-populates id, machine_id, and created_at.

    ```powershell
    function Save-ToForgeMemory {
        [CmdletBinding()]
        param(
            [Parameter(Mandatory=$true)]
            [string]$Table,

            [Parameter(Mandatory=$true)]
            [hashtable]$Data,

            [Parameter(Mandatory=$false)]
            [string]$DatabasePath
        )

        if (-not $DatabasePath) { $DatabasePath = Get-ForgeDbPath }

        # Auto-populate required fields
        if (-not $Data.ContainsKey('id')) {
            $Data['id'] = [guid]::NewGuid().ToString()
        }
        if (-not $Data.ContainsKey('machine_id')) {
            $Data['machine_id'] = Get-MachineId
        }
        if (-not $Data.ContainsKey('created_at')) {
            $Data['created_at'] = (Get-Date -Format 'o')
        }

        # Build column and value lists
        $columns = @()
        $values = @()
        foreach ($key in $Data.Keys) {
            $columns += $key
            $val = $Data[$key]
            if ($null -eq $val) {
                $values += 'NULL'
            }
            elseif ($val -is [int] -or $val -is [long] -or $val -is [double] -or $val -is [float]) {
                $values += $val.ToString()
            }
            elseif ($val -is [bool]) {
                $values += if ($val) { '1' } else { '0' }
            }
            elseif ($val -is [array] -or $val -is [hashtable]) {
                $jsonVal = ($val | ConvertTo-Json -Depth 10 -Compress) -replace "'", "''"
                $values += "'$jsonVal'"
            }
            else {
                $strVal = $val.ToString() -replace "'", "''"
                $values += "'$strVal'"
            }
        }

        $columnList = $columns -join ', '
        $valueList = $values -join ', '
        $query = "INSERT INTO $Table ($columnList) VALUES ($valueList)"

        try {
            Invoke-Sqlite -Database $DatabasePath -Query $query
            return $Data['id']
        }
        catch {
            Write-Host "  [ERROR] Save-ToForgeMemory failed on $Table : $($_.Exception.Message)" -ForegroundColor Red
            throw
        }
    }
    ```

    === FUNCTION 2: Update-FixPattern ===
    ```powershell
    function Update-FixPattern {
        [CmdletBinding()]
        param(
            [Parameter(Mandatory=$true)]
            [string]$Fingerprint,

            [Parameter(Mandatory=$false)]
            [string]$FixDiff,

            [Parameter(Mandatory=$false)]
            [string]$FixDescription,

            [Parameter(Mandatory=$false)]
            [string]$DatabasePath
        )

        if (-not $DatabasePath) { $DatabasePath = Get-ForgeDbPath }

        $setClauses = @("occurrence_count = occurrence_count + 1", "last_seen = datetime('now')")
        if ($FixDiff) {
            $safeDiff = $FixDiff -replace "'", "''"
            $setClauses += "fix_diff = '$safeDiff'"
        }
        if ($FixDescription) {
            $safeDesc = $FixDescription -replace "'", "''"
            $setClauses += "fix_description = '$safeDesc'"
        }

        $setClause = $setClauses -join ', '
        $query = "UPDATE fix_patterns SET $setClause WHERE error_fingerprint = '$Fingerprint'"
        Invoke-Sqlite -Database $DatabasePath -Query $query
    }
