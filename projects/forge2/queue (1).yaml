- id: r1-021
  name: "SCAN Op 1 Directory Tree Enumeration"
  description: |
    You are building FORGE 2.0 at C:\Users\manag\Documents\FORGE 2.0\
    Replace the Invoke-ScanDirectoryTree stub in modules\ForgeRetrofit.psm1 (#region SCAN).

    This function walks a project directory and produces a complete file inventory. It runs against TARGET projects (any codebase FORGE is pointed at), not just FORGE itself.

    ```powershell
    function Invoke-ScanDirectoryTree {
        [CmdletBinding()]
        param(
            [Parameter(Mandatory=$true)]
            [string]$ProjectPath
        )

        $sw = [System.Diagnostics.Stopwatch]::StartNew()
        $excludePattern = 'node_modules|\.next|\.git[/\\]|dist[/\\]|build[/\\]|coverage|\.vercel|__pycache__|\.forge[/\\]'

        $allFiles = Get-ChildItem -Path $ProjectPath -Recurse -File -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -notmatch $excludePattern }

        $files = @()
        foreach ($file in $allFiles) {
            $relativePath = $file.FullName.Replace($ProjectPath, '').TrimStart('\', '/')
            $files += @{
                FullName = $file.FullName
                RelativePath = $relativePath
                Extension = $file.Extension.ToLower()
                SizeKB = [math]::Round($file.Length / 1KB, 2)
                LastModified = $file.LastWriteTime.ToString('o')
            }
        }

        $summary = $files | Group-Object { $_.Extension } | ForEach-Object {
            @{
                Extension = $_.Name
                Count = $_.Count
                TotalSizeKB = [math]::Round(($_.Group | Measure-Object -Property SizeKB -Sum).Sum, 2)
            }
        } | Sort-Object { $_.Count } -Descending

        $totalSizeKB = [math]::Round(($files | Measure-Object -Property SizeKB -Sum).Sum, 2)
        $sw.Stop()

        Write-Host "  Files: $($files.Count) | Size: ${totalSizeKB}KB | Extensions: $($summary.Count) | Time: $($sw.ElapsedMilliseconds)ms" -ForegroundColor Gray

        return @{
            Files = $files
            Summary = $summary
            TotalFiles = $files.Count
            TotalSizeKB = $totalSizeKB
            FilesByExtension = ($summary | ForEach-Object { @{ $_.Extension = $_.Count } })
            ScanTimestamp = (Get-Date -Format 'o')
            Duration = $sw.ElapsedMilliseconds
        }
    }
