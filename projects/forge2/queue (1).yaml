    ```powershell
    function Get-BestPromptTemplates {
        [CmdletBinding()]
        param(
            [Parameter(Mandatory=$true)]
            [string]$TaskType,

            [Parameter(Mandatory=$false)]
            [int]$MinSamples = 3,

            [Parameter(Mandatory=$false)]
            [string]$DatabasePath
        )

        if (-not $DatabasePath) { $DatabasePath = Get-ForgeDbPath }

        $query = @"
    SELECT prompt_template_hash,
           AVG(first_pass_success) as avg_success,
           AVG(gate_pass_rate) as avg_gate_rate,
           AVG(tokens_consumed) as avg_tokens,
           COUNT(*) as sample_count
    FROM prompt_scores
    WHERE task_type = '$TaskType'
    GROUP BY prompt_template_hash
    HAVING COUNT(*) >= $MinSamples
    ORDER BY avg_success DESC, avg_gate_rate DESC
    "@
        $results = Invoke-Sqlite -Database $DatabasePath -Query $query
        if ($null -eq $results) { return @() }
        if ($results -isnot [array]) { return @($results) }
        return $results
    }
    ```

    === FUNCTION 2: Get-DecisionWeights ===
    ```powershell
    function Get-DecisionWeights {
        [CmdletBinding()]
        param(
            [Parameter(Mandatory=$true)]
            [string]$DecisionType,

            [Parameter(Mandatory=$false)]
            [int]$MinBuilds = 2,

            [Parameter(Mandatory=$false)]
            [string]$DatabasePath
        )

        if (-not $DatabasePath) { $DatabasePath = Get-ForgeDbPath }

        $query = @"
    SELECT option_chosen,
           AVG(downstream_error_rate) as avg_error_rate,
           AVG(downstream_retry_rate) as avg_retry_rate,
           SUM(sample_size) as total_samples,
           COUNT(DISTINCT build_id) as build_count
    FROM decision_weights
    WHERE decision_type = '$DecisionType'
    GROUP BY option_chosen
    HAVING SUM(sample_size) >= $MinBuilds
    ORDER BY avg_error_rate ASC
    "@
        $results = Invoke-Sqlite -Database $DatabasePath -Query $query
        if ($null -eq $results) { return @() }
        if ($results -isnot [array]) { return @($results) }
        return $results
    }
    ```

