- id: r1-017
  name: "Hook System Action Execution with Timeout"
  description: |
    You are building FORGE 2.0 at C:\Users\manag\Documents\FORGE 2.0\
    Implement Invoke-HookAction in modules\ForgeHooks.psm1.

    BEHAVIORAL CONTRACTS:
    - MUST enforce timeout on every hook execution — no hook runs indefinitely
    - MUST capture stdout/stderr up to 10,000 characters (truncate beyond)
    - Invoke-Expression is the ONE permitted use inside hooks per BEHAVIORAL_CONTRACTS — sandboxed via Start-Job
    - MUST track duration in milliseconds

    ```powershell
    function Invoke-HookAction {
        [CmdletBinding()]
        param(
            [Parameter(Mandatory=$true)]
            [hashtable]$Hook,

            [Parameter(Mandatory=$true)]
            [string]$Action,

            [Parameter(Mandatory=$true)]
            [hashtable]$Context
        )

        $timeout = if ($Hook.timeout_seconds) { $Hook.timeout_seconds } else { 30 }
        $sw = [System.Diagnostics.Stopwatch]::StartNew()

        try {
            # Run in isolated job for timeout enforcement
            $job = Start-Job -ScriptBlock {
                param($ActionScript)
                try {
                    $result = Invoke-Expression $ActionScript
                    return @{ Success = $true; Output = ($result | Out-String) }
                }
                catch {
                    return @{ Success = $false; Output = $_.Exception.Message }
                }
            } -ArgumentList $Action

            $completed = Wait-Job $job -Timeout $timeout

            if (-not $completed -or $job.State -eq 'Running') {
                # Timeout
                Stop-Job $job -ErrorAction SilentlyContinue
                Remove-Job $job -Force -ErrorAction SilentlyContinue
                $sw.Stop()
                return @{
                    Status = 'TIMEOUT'
                    Output = "Hook timed out after $timeout seconds"
                    Duration = $sw.ElapsedMilliseconds
                }
            }

            $jobResult = Receive-Job $job -ErrorAction SilentlyContinue
            $jobError = $job.ChildJobs[0].Error | Out-String
            Remove-Job $job -Force -ErrorAction SilentlyContinue
            $sw.Stop()

            # Capture output (truncate to 10,000 chars)
            $output = ''
            if ($jobResult -is [hashtable] -and $jobResult.ContainsKey('Output')) {
                $output = $jobResult.Output
            }
            elseif ($jobResult) {
                $output = $jobResult | Out-String
            }
            if ($jobError) { $output += "`n$jobError" }
            if ($output.Length -gt 10000) { $output = $output.Substring(0, 10000) + '... [TRUNCATED]' }

            # Determine status
            $status = 'PASS'
            if ($jobResult -is [hashtable] -and $jobResult.ContainsKey('Success') -and -not $jobResult.Success) {
                $status = 'FAIL'
            }
            elseif ($job.State -eq 'Failed') {
                $status = 'FAIL'
            }

            return @{
                Status = $status
                Output = $output.Trim()
                Duration = $sw.ElapsedMilliseconds
            }
        }
        catch {
            $sw.Stop()
            return @{
                Status = 'FAIL'
                Output = $_.Exception.Message
                Duration = $sw.ElapsedMilliseconds
            }
        }
    }
    ```

