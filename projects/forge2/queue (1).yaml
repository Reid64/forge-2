            ApiRoutes = $apiRoutes
            Middleware = $middleware
            Layouts = $layouts
            TotalPages = $pageRoutes.Count
            TotalAPIs = $apiRoutes.Count
            TotalMiddleware = $middleware.Count
            TotalLayouts = $layouts.Count
