- id: r1-002
  name: "SQLite Core Wrapper (Invoke-Sqlite)"
  description: |
    You are building FORGE 2.0 at C:\Users\manag\Documents\FORGE 2.0\
    This prompt implements the lowest-level data access function. EVERY other learning engine function depends on this. It MUST work correctly or the entire build fails.

    WHAT TO IMPLEMENT in modules\ForgeLearning.psm1:
    Replace the Invoke-Sqlite and Get-ForgeDbPath stubs with full implementations.

    === Get-ForgeDbPath ===
    ```powershell
    function Get-ForgeDbPath {
        [CmdletBinding()]
        param()
        $forgeDir = Join-Path $HOME '.forge'
        return (Join-Path $forgeDir 'forge_memory.db')
    }
    ```

    === Invoke-Sqlite ===
    This function must handle THREE modes:
    1. SELECT queries — return [PSCustomObject[]]
    2. INSERT/UPDATE/DELETE — return [int] affected row count
    3. DDL (CREATE TABLE, CREATE INDEX) — execute and return $null

    Implementation requirements:
    - First attempt: sqlite3 CLI with -json flag
    - Fallback: System.Data.SQLite .NET assembly from lib\ directory
    - MUST support parameterized queries — NEVER string-interpolate user data into SQL
    - MUST handle single quotes in values via proper escaping
    - MUST throw terminating error on SQL syntax errors with original message preserved
    - MUST handle empty result sets (return empty array, not $null)

    Write the COMPLETE implementation:
    ```powershell
    function Invoke-Sqlite {
        [CmdletBinding()]
        param(
            [Parameter(Mandatory=$true)]
            [string]$Database,

            [Parameter(Mandatory=$true)]
            [string]$Query,

            [Parameter(Mandatory=$false)]
            [hashtable]$Parameters
        )

        # Determine query type
        $queryType = 'DDL'
        $trimmedQuery = $Query.TrimStart()
        if ($trimmedQuery -match '^SELECT') { $queryType = 'SELECT' }
        elseif ($trimmedQuery -match '^(INSERT|UPDATE|DELETE)') { $queryType = 'DML' }

        # Apply parameters if provided (simple placeholder replacement with escaping)
        $execQuery = $Query
        if ($Parameters) {
            foreach ($key in $Parameters.Keys) {
                $safeValue = ($Parameters[$key] -replace "'", "''")
                $execQuery = $execQuery -replace ":$key", "'$safeValue'"
            }
        }

        # Try sqlite3 CLI first
        $sqlite3 = $null
        $libSqlite = Join-Path $PSScriptRoot '..\lib\sqlite3.exe'
        if (Get-Command 'sqlite3' -ErrorAction SilentlyContinue) {
            $sqlite3 = 'sqlite3'
        } elseif (Test-Path $libSqlite) {
            $sqlite3 = $libSqlite
        }

        if ($sqlite3) {
            try {
                if ($queryType -eq 'SELECT') {
                    $jsonOutput = & $sqlite3 $Database -json $execQuery 2>&1
                    $stderr = $jsonOutput | Where-Object { $_ -is [System.Management.Automation.ErrorRecord] }
                    $stdout = $jsonOutput | Where-Object { $_ -isnot [System.Management.Automation.ErrorRecord] }

                    if ($stderr) {
                        $errorMsg = ($stderr | ForEach-Object { $_.ToString() }) -join "`n"
                        if ($errorMsg -match 'Error|error') {
                            throw "SQLite error: $errorMsg"
                        }
                    }

                    $jsonText = ($stdout | Out-String).Trim()
                    if ([string]::IsNullOrWhiteSpace($jsonText) -or $jsonText -eq '[]') {
                        return @()
                    }
                    $results = $jsonText | ConvertFrom-Json
                    if ($results -isnot [array]) { $results = @($results) }
                    return $results
                }
                else {
                    $output = & $sqlite3 $Database $execQuery 2>&1
                    $stderr = $output | Where-Object { $_ -is [System.Management.Automation.ErrorRecord] }
                    if ($stderr) {
                        $errorMsg = ($stderr | ForEach-Object { $_.ToString() }) -join "`n"
                        if ($errorMsg -match 'Error|error') {
                            throw "SQLite error: $errorMsg"
                        }
                    }

                    if ($queryType -eq 'DML') {
                        $changesOutput = & $sqlite3 $Database "SELECT changes();" 2>&1
                        $changesText = ($changesOutput | Where-Object { $_ -isnot [System.Management.Automation.ErrorRecord] } | Out-String).Trim()
                        return [int]($changesText -replace '[^\d]', '')
                    }
                    return $null
                }
            }
            catch {
                throw $_
            }
        }

        # Fallback: .NET System.Data.SQLite assembly
        $assemblyPath = Join-Path $PSScriptRoot '..\lib\System.Data.SQLite.dll'
        if (Test-Path $assemblyPath) {
            [System.Reflection.Assembly]::LoadFrom($assemblyPath) | Out-Null
        }

        try {
            $connectionString = "Data Source=$Database;Version=3;"
            $connection = New-Object System.Data.SQLite.SQLiteConnection($connectionString)
            $connection.Open()

            $command = $connection.CreateCommand()
            $command.CommandText = $execQuery

            if ($queryType -eq 'SELECT') {
                $reader = $command.ExecuteReader()
                $results = @()
                while ($reader.Read()) {
                    $row = [ordered]@{}
                    for ($i = 0; $i -lt $reader.FieldCount; $i++) {
                        $row[$reader.GetName($i)] = if ($reader.IsDBNull($i)) { $null } else { $reader.GetValue($i) }
                    }
                    $results += [PSCustomObject]$row
                }
                $reader.Close()
                $connection.Close()
                return $results
            }
            else {
                $affected = $command.ExecuteNonQuery()
                $connection.Close()
                if ($queryType -eq 'DML') { return $affected }
                return $null
            }
        }
        catch {
