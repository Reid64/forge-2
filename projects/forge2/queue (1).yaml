- id: r1-012
  name: "Core Pipeline Retry Logic & Git Snapshots"
  description: |
    You are building FORGE 2.0 at C:\Users\manag\Documents\FORGE 2.0\
    Implement four functions in modules\ForgeCore.psm1 for git snapshot management and prompt retry logic.

    BEHAVIORAL CONTRACTS (ForgeCore):
    - MUST create a git snapshot (tag) before every prompt execution
    - Before any git operation: verify .git directory exists — if not, initialize git
    - Git commits MUST use structured format: FORGE-{project}-P{phase}-T{task}-{status}
    - MUST NOT execute next prompt if prior blocking gate failed and max retries exhausted — skip and log

    === New-ForgeSnapshot ===
    ```powershell
    function New-ForgeSnapshot {
        [CmdletBinding()]
        param(
            [Parameter(Mandatory=$true)]
            [string]$ProjectPath,

            [Parameter(Mandatory=$true)]
            [string]$PromptId
        )

        Push-Location $ProjectPath
        try {
            # Ensure git repo exists
            if (-not (Test-Path '.git')) {
                Write-Host "  [GIT] Initializing git repository..." -ForegroundColor Cyan
                git init 2>$null
                git add -A 2>$null
                git commit -m 'FORGE init' --allow-empty 2>$null
            }

            $tagName = "FORGE-SNAPSHOT-$PromptId"
            # Stage everything and create a commit for the tag
            git add -A 2>$null
            git commit -m "Pre-snapshot for $PromptId" --allow-empty 2>$null
            git tag -f $tagName 2>$null
            Write-Host "  [GIT] Snapshot created: $tagName" -ForegroundColor Gray
        }
        finally {
            Pop-Location
        }
    }
    ```

    === Invoke-ForgeRollback ===
    ```powershell
    function Invoke-ForgeRollback {
        [CmdletBinding()]
        param(
            [Parameter(Mandatory=$true)]
            [string]$ProjectPath,

            [Parameter(Mandatory=$true)]
            [string]$PromptId
        )

        Push-Location $ProjectPath
        try {
            $tagName = "FORGE-SNAPSHOT-$PromptId"
            $tagExists = git tag -l $tagName 2>$null
            if ($tagExists) {
                git checkout $tagName -- . 2>$null
                Write-Host "  [GIT] Rolled back to $tagName" -ForegroundColor Yellow
            }
            else {
                Write-Host "  [GIT] Snapshot $tagName not found — rollback skipped" -ForegroundColor Red
            }
        }
        finally {
            Pop-Location
        }
    }
    ```

    === New-ForgeCommit ===
