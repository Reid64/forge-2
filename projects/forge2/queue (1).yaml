        @{ machine_id=(Get-MachineId); build_id=$BuildId; started_at=(Get-Date -Format 'o'); pid=$PID } | ConvertTo-Json -Depth 10 | Set-Content $lockPath -Encoding UTF8
        Write-Host "  [SESSION] Lock set: $lockPath" -ForegroundColor Gray
    }

    function Remove-ForgeLock {
        [CmdletBinding()]
        param([Parameter(Mandatory=$true)][string]$ProjectPath)
        $lockPath = Join-Path $ProjectPath '.forge\forge_running.lock'
        if (Test-Path $lockPath) { Remove-Item $lockPath -Force -ErrorAction SilentlyContinue }
    }

    function Test-CrashRecovery {
        [CmdletBinding()]
        param([Parameter(Mandatory=$true)][string]$ProjectPath)
        $lockPath = Join-Path $ProjectPath '.forge\forge_running.lock'
        if (-not (Test-Path $lockPath)) { return @{ CrashDetected=$false } }
        try {
            $lock = Get-Content $lockPath -Raw | ConvertFrom-Json
            Write-Host "  [SESSION] Stale lock detected — build '$($lock.build_id)' started at $($lock.started_at)" -ForegroundColor Yellow
            $snapshot = $null
            try { $snapshot = Restore-CompactedContext -BuildId $lock.build_id } catch {}
            Remove-ForgeLock -ProjectPath $ProjectPath
            return @{ CrashDetected=$true; BuildId=$lock.build_id; RecoveryAvailable=($null -ne $snapshot); LastSnapshot=$snapshot }
        } catch {
            Remove-ForgeLock -ProjectPath $ProjectPath
            return @{ CrashDetected=$true; BuildId='unknown'; RecoveryAvailable=$false }
        }
    }
    ```
