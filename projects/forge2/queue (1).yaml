    === Invoke-PromptWithRetry ===
    ```powershell
    function Invoke-PromptWithRetry {
        [CmdletBinding()]
        param(
            [Parameter(Mandatory=$true)]
            [string]$ProjectPath,

            [Parameter(Mandatory=$true)]
            [string]$PromptId,

            [Parameter(Mandatory=$true)]
            [scriptblock]$ExecuteBlock,

            [Parameter(Mandatory=$false)]
            [int]$MaxRetries = 2
        )

        $attempts = 0
        $errors = @()
        $sw = [System.Diagnostics.Stopwatch]::StartNew()

        while ($attempts -le $MaxRetries) {
            $attempts++
            try {
                Write-Host "  [EXECUTE] $PromptId attempt $attempts/$($MaxRetries + 1)" -ForegroundColor Cyan
                $result = & $ExecuteBlock
                $sw.Stop()
                return @{
                    PromptId = $PromptId
                    Status = 'PASS'
                    Attempts = $attempts
                    Errors = $errors
                    Duration = $sw.ElapsedMilliseconds
                    Result = $result
                }
            }
            catch {
                $errorMsg = $_.Exception.Message
                $errors += $errorMsg
                Write-Host "  [RETRY] $PromptId attempt $attempts failed: $errorMsg" -ForegroundColor Yellow

                if ($attempts -le $MaxRetries) {
                    Write-Host "  [RETRY] Rolling back and retrying with error context..." -ForegroundColor Yellow
                    Invoke-ForgeRollback -ProjectPath $ProjectPath -PromptId $PromptId
                }
            }
        }

        $sw.Stop()
        Write-Host "  [FAIL] $PromptId exhausted all $MaxRetries retries" -ForegroundColor Red

        # Register the error pattern in learning database
        try {
            Register-Error -ErrorCode 'PROMPT_FAIL' -FilePath $PromptId -ErrorMessage ($errors[-1]) -TechStack @('powershell') -ErrorCategory 'RUNTIME'
        } catch { }

        return @{
            PromptId = $PromptId
            Status = 'FAIL'
            Attempts = $attempts
            Errors = $errors
            Duration = $sw.ElapsedMilliseconds
            Result = $null
        }
    }
    ```

