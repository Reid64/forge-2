    function Get-ForgeConfig {
        [CmdletBinding()]
        param(
            [Parameter(Mandatory=$true)]
            [string]$ProjectPath
        )

        $configPath = Join-Path $ProjectPath 'forge_config.json'

        if (Test-Path $configPath) {
            try {
