    ```powershell
    function Invoke-ScanTscCheck {
        [CmdletBinding()]
        param([Parameter(Mandatory=$true)][string]$ProjectPath)

        if (-not (Test-Path (Join-Path $ProjectPath 'tsconfig.json'))) {
            return @{ Status='SKIP'; Errors=@(); ErrorCount=0; Detail='No tsconfig.json' }
        }

        $sw = [System.Diagnostics.Stopwatch]::StartNew()
        Push-Location $ProjectPath
        try {
            $output = & npx tsc --noEmit --pretty 2>&1 | Out-String
            $sw.Stop()

            $errorMatches = [regex]::Matches($output, '(\S+)\((\d+),(\d+)\):\s+error\s+(TS\d+):\s+(.+)')
            $errors = @()
            foreach ($m in $errorMatches) {
                $errors += @{ File=$m.Groups[1].Value; Line=[int]$m.Groups[2].Value; Column=[int]$m.Groups[3].Value; Code=$m.Groups[4].Value; Message=$m.Groups[5].Value.Trim() }
            }

            $status = if ($errors.Count -eq 0) { 'PASS' } else { 'FAIL' }
            Write-Host "  TSC: $status ($($errors.Count) errors, $($sw.ElapsedMilliseconds)ms)" -ForegroundColor $(if ($status -eq 'PASS') { 'Green' } else { 'Red' })

            return @{ Status=$status; Errors=$errors; ErrorCount=$errors.Count; Duration=$sw.ElapsedMilliseconds }
        }
        catch {
            $sw.Stop()
            return @{ Status='SKIP'; Errors=@(); ErrorCount=0; Detail="npx tsc failed: $($_.Exception.Message)" }
        }
        finally { Pop-Location }
    }

    function Invoke-ScanTestExecution {
        [CmdletBinding()]
        param([Parameter(Mandatory=$true)][string]$ProjectPath)

        # Count test files
        $testFiles = Get-ChildItem -Path $ProjectPath -Recurse -Include '*.test.ts','*.spec.ts','*.test.tsx','*.spec.tsx','*.test.js','*.spec.js' -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -notmatch 'node_modules|\.next|dist' }
        $testCount = @($testFiles).Count

        if ($testCount -eq 0) {
            return @{ Status='NO_TESTS'; Framework=$null; TestFileCount=0; Passed=0; Failed=0 }
        }

        # Detect framework
        $framework = $null
        if (Test-Path (Join-Path $ProjectPath 'vitest.config.ts')) { $framework = 'vitest' }
        elseif (Test-Path (Join-Path $ProjectPath 'jest.config.ts')) { $framework = 'jest' }
        elseif (Test-Path (Join-Path $ProjectPath 'jest.config.js')) { $framework = 'jest' }

        if (-not $framework) {
            return @{ Status='SKIP'; Framework=$null; TestFileCount=$testCount; Passed=0; Failed=0; Detail="$testCount test files found but no test framework configured" }
        }

        # Try to run tests
        Push-Location $ProjectPath
        try {
