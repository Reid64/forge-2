            [Parameter(Mandatory=$true)]
            [string]$ProjectPath,

            [Parameter(Mandatory=$true)]
            [string]$ProjectName
        )

        $defaultHooks = @{
            schema_version = '1.0'
            project_name = $ProjectName
            hooks = @(
                # SessionStart (3)
                @{ name='sync-pull'; event='SessionStart'; action='powershell'; script='Sync-ForgeMemory -Direction Pull'; blocking=$false; timeout_seconds=30; enabled=$true; on_failure='WARN'; priority=10; description='Pull learning data from master at session start' }
                @{ name='load-knowledge'; event='SessionStart'; action='powershell'; script='Load-CrossProjectKnowledge'; blocking=$false; timeout_seconds=15; enabled=$true; on_failure='WARN'; priority=20; description='Load cross-project rules and skills' }
