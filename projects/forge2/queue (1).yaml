            Status = $Status
            Attempts = $Attempts
            Tokens = $Tokens
            Duration = $Duration
            Timestamp = (Get-Date -Format 'o')
        }

        $statusColor = switch ($Status) { 'PASS' { 'Green' } 'FAIL' { 'Red' } 'SKIP' { 'Yellow' } }
