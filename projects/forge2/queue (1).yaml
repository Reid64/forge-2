    function Invoke-ScanDbSchema {
        [CmdletBinding()]
        param(
            [Parameter(Mandatory=$true)]
            [string]$ProjectPath
        )

        $migrationDir = Join-Path $ProjectPath 'supabase\migrations'
        $migrationTables = @()
        $issues = @()

        # Parse migration files for CREATE TABLE
        if (Test-Path $migrationDir) {
            $sqlFiles = Get-ChildItem -Path $migrationDir -Filter '*.sql' -ErrorAction SilentlyContinue | Sort-Object Name
            foreach ($sqlFile in $sqlFiles) {
                $content = Get-Content $sqlFile.FullName -Raw -ErrorAction SilentlyContinue
                if ($content) {
                    $tableMatches = [regex]::Matches($content, 'CREATE\s+TABLE\s+(?:IF\s+NOT\s+EXISTS\s+)?(?:public\.)?(\w+)', 'IgnoreCase')
                    foreach ($m in $tableMatches) {
                        $tableName = $m.Groups[1].Value
                        if ($tableName -notin $migrationTables) { $migrationTables += $tableName }
                    }
                }
            }
        } else {
            Write-Host "  No supabase/migrations directory" -ForegroundColor Yellow
        }

        # Parse database.types.ts for TypeScript type definitions
        $typesTables = @()
        $typesFile = Join-Path $ProjectPath 'database.types.ts'
        if (-not (Test-Path $typesFile)) { $typesFile = Join-Path $ProjectPath 'src\database.types.ts' }
        if (Test-Path $typesFile) {
            $content = Get-Content $typesFile -Raw -ErrorAction SilentlyContinue
            if ($content) {
                $tableMatches = [regex]::Matches($content, '(\w+)\s*:\s*\{[^}]*Row\s*:', 'IgnoreCase')
                foreach ($m in $tableMatches) {
                    $typesTables += $m.Groups[1].Value
                }
            }
        }

        # Compare sources
        foreach ($mt in $migrationTables) {
            if ($typesTables.Count -gt 0 -and $mt -notin $typesTables) {
                $issues += @{ Table=$mt; Issue='TABLE_MISSING_IN_TYPES'; Severity='WARN'; Detail="$mt exists in migrations but not in TypeScript types" }
            }
        }
        foreach ($tt in $typesTables) {
            if ($tt -notin $migrationTables) {
                $issues += @{ Table=$tt; Issue='TABLE_MISSING_IN_MIGRATIONS'; Severity='CRITICAL'; Detail="$tt exists in types but not in migrations" }
            }
        }

        Write-Host "  Migration tables: $($migrationTables.Count) | Type tables: $($typesTables.Count) | Issues: $($issues.Count)" -ForegroundColor Gray

        return @{
            MigrationTables = $migrationTables
            TypesTables = $typesTables
            Issues = $issues
            MigrationFileCount = if (Test-Path $migrationDir) { (Get-ChildItem $migrationDir -Filter '*.sql').Count } else { 0 }
        }
    }
