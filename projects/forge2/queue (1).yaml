  description: |
    You are building FORGE 2.0 at C:\Users\manag\Documents\FORGE 2.0\
    Replace Invoke-ScanGitHistory, Invoke-ScanPackageAudit, and Invoke-ScanGovernance stubs in modules\ForgeRetrofit.psm1 (#region SCAN).

    ```powershell
    function Invoke-ScanGitHistory {
        [CmdletBinding()]
        param([Parameter(Mandatory=$true)][string]$ProjectPath)

        if (-not (Test-Path (Join-Path $ProjectPath '.git'))) {
            return @{ Available=$false; Detail='No .git directory' }
        }

        Push-Location $ProjectPath
        try {
            $lastCommit = git log -1 --format='%H|%ai|%s' 2>$null
            $commitParts = if ($lastCommit) { $lastCommit -split '\|', 3 } else { @('','','') }
            $branches = @(git branch --list 2>$null | ForEach-Object { $_.Trim().TrimStart('* ') })
            $uncommitted = @(git status --porcelain 2>$null)
            $daysSince = if ($commitParts[1]) { ((Get-Date) - [datetime]$commitParts[1]).Days } else { -1 }

            return @{
                Available = $true
                LastCommitHash = $commitParts[0]
                LastCommitDate = $commitParts[1]
                LastCommitMessage = $commitParts[2]
                DaysSinceLastCommit = $daysSince
                BranchCount = $branches.Count
                UncommittedChanges = $uncommitted.Count
                IsClean = ($uncommitted.Count -eq 0)
            }
        } finally { Pop-Location }
    }

    function Invoke-ScanPackageAudit {
        [CmdletBinding()]
        param([Parameter(Mandatory=$true)][string]$ProjectPath)

        $pkgPath = Join-Path $ProjectPath 'package.json'
        if (-not (Test-Path $pkgPath)) {
            return @{ Available=$false; Detail='No package.json' }
        }

        try {
            $pkg = Get-Content $pkgPath -Raw | ConvertFrom-Json
            $deps = if ($pkg.dependencies) { ($pkg.dependencies.PSObject.Properties).Count } else { 0 }
            $devDeps = if ($pkg.devDependencies) { ($pkg.devDependencies.PSObject.Properties).Count } else { 0 }

            return @{
                Available = $true
                DependencyCount = $deps
                DevDependencyCount = $devDeps
                TotalDeps = $deps + $devDeps
                PackageManager = if (Test-Path (Join-Path $ProjectPath 'pnpm-lock.yaml')) { 'pnpm' }
                                 elseif (Test-Path (Join-Path $ProjectPath 'yarn.lock')) { 'yarn' }
                                 elseif (Test-Path (Join-Path $ProjectPath 'package-lock.json')) { 'npm' }
                                 else { 'unknown' }
            }
        } catch {
            return @{ Available=$false; Detail="package.json parse error: $($_.Exception.Message)" }
        }
    }

    function Invoke-ScanGovernance {
        [CmdletBinding()]
        param([Parameter(Mandatory=$true)][string]$ProjectPath)

        $govFiles = @('STATE_OF_THE_BUILD.md','SESSION_STATE.md','BLUEPRINT.md','SCHEMA_REGISTRY.md','AGENTS.md','BEHAVIORAL_CONTRACTS.md','README.md','.gitignore','LICENSE','CHANGELOG.md')
        $results = @()

        foreach ($name in $govFiles) {
            $path = Join-Path $ProjectPath $name
            if (Test-Path $path) {
                $file = Get-Item $path
                $daysSinceModified = ((Get-Date) - $file.LastWriteTime).Days
                $status = if ($daysSinceModified -le 7) { 'CURRENT' }
                           elseif ($daysSinceModified -le 30) { 'AGING' }
                           else { 'STALE' }
                $results += @{ Name=$name; Exists=$true; SizeKB=[math]::Round($file.Length/1KB,2); LastModified=$file.LastWriteTime.ToString('o'); DaysSinceModified=$daysSinceModified; Status=$status }
            } else {
                $results += @{ Name=$name; Exists=$false; SizeKB=0; LastModified=$null; DaysSinceModified=$null; Status='MISSING' }
            }
        }

        $present = ($results | Where-Object { $_.Exists }).Count
        $missing = ($results | Where-Object { -not $_.Exists }).Count
        Write-Host "  Governance: $present present, $missing missing" -ForegroundColor $(if ($missing -gt 3) { 'Yellow' } else { 'Gray' })

        return $results
    }
