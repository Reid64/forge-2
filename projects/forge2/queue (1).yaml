- id: r1-018
  name: "Hook System Main Orchestrator (Invoke-Hook)"
  description: |
    You are building FORGE 2.0 at C:\Users\manag\Documents\FORGE 2.0\
    Implement Invoke-Hook in modules\ForgeHooks.psm1. This is THE single entry point all FORGE modules call for hook lifecycle events.

    BEHAVIORAL CONTRACTS:
    - MUST execute hooks in priority order (ascending) within each event
    - MUST enforce timeout on every hook — no hook runs indefinitely
    - MUST log every hook execution to hook_execution_log (including SKIP results)
    - MUST prevent hook recursion (depth > 2 suppressed with WARN)
    - MUST NOT execute disabled hooks — skip silently, no logging
    - MUST NOT execute hooks concurrently — sequential only
    - Blocking hook FAIL = halt further hooks, return AllPassed=$false
    - on_failure='WARN' = log and continue even if blocking
    - on_failure='REVERT' = git checkout -- $file before halting
    - hooks.json parse failure = fall back to minimal hooks

    ```powershell
    function Invoke-Hook {
        [CmdletBinding()]
        param(
            [Parameter(Mandatory=$true)]
            [string]$Event,

            [Parameter(Mandatory=$true)]
            [hashtable]$Context,

            [Parameter(Mandatory=$false)]
            [string]$ProjectPath,

            [Parameter(Mandatory=$false)]
            [string]$DatabasePath
        )

        # Recursion guard
        if (-not $Global:HookDepth) { $Global:HookDepth = 0 }
        $Global:HookDepth++
        if ($Global:HookDepth -gt 2) {
            Write-Host "  [HOOKS] Recursion depth > 2 — suppressing event '$Event'" -ForegroundColor Yellow
            $Global:HookDepth--
            return @{ AllPassed = $true; BlockedBy = $null; Results = @() }
        }

        try {
            # Load hooks
            $hooks = @()
            if ($ProjectPath) {
                $hooks = Read-HooksConfig -ProjectPath $ProjectPath
            }

            # Filter by event and enabled
            $eventHooks = @($hooks | Where-Object { $_.event -eq $Event -and $_.enabled })

            if ($eventHooks.Count -eq 0) {
                return @{ AllPassed = $true; BlockedBy = $null; Results = @() }
            }

            $results = @()
            $allPassed = $true
            $blockedBy = $null

            foreach ($hook in $eventHooks) {
                # Check conditions
                $conditionsMet = Test-HookConditions -Hook @{ conditions = $hook.conditions } -Context $Context
                if (-not $conditionsMet) {
                    Write-Host "  [HOOK] $($hook.name) SKIP (conditions not met)" -ForegroundColor Gray
                    continue
                }

                # Resolve templates in action/script
                $action = if ($hook.script) { $hook.script } else { $hook.action }
                $resolvedAction = Resolve-HookTemplates -Action $action -Context $Context

                # Execute
                $hookResult = Invoke-HookAction -Hook @{ timeout_seconds = $hook.timeout_seconds } -Action $resolvedAction -Context $Context

                # Log to database
                if ($DatabasePath) {
                    try {
                        Save-ToForgeMemory -Table 'hook_execution_log' -Data @{
                            hook_name = $hook.name
                            event = $Event
                            status = $hookResult.Status
                            duration_ms = $hookResult.Duration
                            output = if ($hookResult.Output) { $hookResult.Output.Substring(0, [Math]::Min(5000, $hookResult.Output.Length)) } else { '' }
                            build_id = if ($Context.build_id) { $Context.build_id } else { 'unknown' }
                            prompt_number = if ($Context.prompt_number) { [int]$Context.prompt_number } else { 0 }
                        } -DatabasePath $DatabasePath
                    } catch { }  # Don't fail a build because logging failed
                }

                # Console output
                $statusColor = switch ($hookResult.Status) { 'PASS' { 'Green' } 'FAIL' { 'Red' } 'TIMEOUT' { 'Red' } 'SKIP' { 'Yellow' } }
                Write-Host "  [HOOK] $($hook.name) $($hookResult.Status) ($($hookResult.Duration)ms)" -ForegroundColor $statusColor

                $results += @{
                    Name = $hook.name
                    Status = $hookResult.Status
                    Duration = $hookResult.Duration
                    Output = $hookResult.Output
                    Blocking = $hook.blocking
                    OnFailure = $hook.on_failure
                }

                # Handle failures
                if ($hookResult.Status -in @('FAIL','TIMEOUT')) {
                    if ($hook.on_failure -eq 'WARN') {
                        Write-Host "  [HOOK] $($hook.name) failed but on_failure=WARN — continuing" -ForegroundColor Yellow
                        continue
                    }
                    elseif ($hook.on_failure -eq 'REVERT' -and $Context.file) {
                        Push-Location (if ($ProjectPath) { $ProjectPath } else { '.' })
                        try { git checkout -- $Context.file 2>$null } finally { Pop-Location }
                        Write-Host "  [HOOK] $($hook.name) REVERT — reverted $($Context.file)" -ForegroundColor Yellow
                    }

                    if ($hook.blocking) {
                        $allPassed = $false
                        $blockedBy = $hook.name
                        Write-Host "  [HOOK] BLOCKED by $($hook.name) — halting further hooks for $Event" -ForegroundColor Red
                        break
                    }
                }
            }

            return @{ AllPassed = $allPassed; BlockedBy = $blockedBy; Results = $results }
        }
        finally {
            $Global:HookDepth--
        }
    }
    ```

