    Replace Invoke-ScanEnvAudit stub in modules\ForgeRetrofit.psm1 (#region SCAN).

    ```powershell
    function Invoke-ScanEnvAudit {
        [CmdletBinding()]
        param(
            [Parameter(Mandatory=$true)]
            [string]$ProjectPath
        )

        # Source 1: Scan code for process.env references
        $codeRefs = @()
        $codeFiles = Get-ChildItem -Path $ProjectPath -Recurse -Include *.ts,*.tsx,*.js,*.jsx -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -notmatch 'node_modules|\.next|dist' }
        foreach ($file in $codeFiles) {
            $content = Get-Content $file.FullName -Raw -ErrorAction SilentlyContinue
            if ($content) {
                $matches = [regex]::Matches($content, 'process\.env\.([A-Z_][A-Z0-9_]*)')
                foreach ($m in $matches) {
                    if ($m.Groups[1].Value -notin $codeRefs) { $codeRefs += $m.Groups[1].Value }
                }
            }
        }

        # Source 2: Parse .env files (NAMES only — never log values)
        $envVars = @{}
        foreach ($envFile in @('.env.local','.env','.env.development','.env.production')) {
            $envPath = Join-Path $ProjectPath $envFile
            if (Test-Path $envPath) {
                $lines = Get-Content $envPath -ErrorAction SilentlyContinue
                foreach ($line in $lines) {
                    $line = $line.Trim()
                    if ($line -match '^#' -or $line -eq '') { continue }
                    if ($line -match '^([A-Z_][A-Z0-9_]*)=') {
                        $envVars[$Matches[1]] = $envFile
                    }
                }
            }
        }

        # Classify issues
        $issues = @()
        foreach ($ref in $codeRefs) {
            if ($ref -notin $envVars.Keys) {
                $severity = if ($ref -match '^NEXT_PUBLIC_') { 'WARN' } else { 'CRITICAL' }
                $issues += @{ Variable=$ref; Issue='MISSING_LOCAL'; Severity=$severity; Detail="Referenced in code but not defined in any .env file" }
            }
        }
        foreach ($envVar in $envVars.Keys) {
            if ($envVar -notin $codeRefs) {
                $issues += @{ Variable=$envVar; Issue='UNUSED'; Severity='INFO'; Detail="Defined in $($envVars[$envVar]) but never referenced in code" }
            }
        }

        Write-Host "  Code refs: $($codeRefs.Count) | Env vars: $($envVars.Count) | Issues: $($issues.Count)" -ForegroundColor Gray
        foreach ($issue in ($issues | Where-Object { $_.Severity -eq 'CRITICAL' })) {
            Write-Host "    [CRITICAL] $($issue.Variable): $($issue.Issue)" -ForegroundColor Red
        }

        return @{ ReferencedInCode=$codeRefs; DefinedInEnv=[array]$envVars.Keys; Issues=$issues }
    }
    ```

