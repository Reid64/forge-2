    INSERT OR IGNORE INTO forge_meta (key, value) VALUES ('schema_version', '1.0.0'), ('created_at', datetime('now')), ('machine_id', '');

    CREATE TABLE IF NOT EXISTS prompt_scores (id TEXT PRIMARY KEY, prompt_template_hash TEXT NOT NULL, task_type TEXT NOT NULL CHECK(task_type IN ('SCAFFOLD','CRUD','INTEGRATION','AI_PIPELINE','CONFIG','TEST','FIX')), tech_stack_tags TEXT NOT NULL DEFAULT '[]', first_pass_success INTEGER NOT NULL CHECK(first_pass_success IN (0, 1)), retry_count INTEGER NOT NULL DEFAULT 0, tokens_consumed INTEGER NOT NULL DEFAULT 0, gate_pass_rate REAL NOT NULL DEFAULT 0.0 CHECK(gate_pass_rate >= 0.0 AND gate_pass_rate <= 1.0), drift_score REAL NOT NULL DEFAULT 0.0 CHECK(drift_score >= 0.0 AND drift_score <= 1.0), project_name TEXT NOT NULL, build_id TEXT NOT NULL, machine_id TEXT NOT NULL, created_at TEXT NOT NULL DEFAULT (datetime('now')));
