    CREATE TABLE IF NOT EXISTS build_outcomes (id TEXT PRIMARY KEY, project_name TEXT NOT NULL, mode TEXT NOT NULL CHECK(mode IN ('GREENFIELD','RETROFIT')), start_time TEXT NOT NULL, end_time TEXT, end_reason TEXT CHECK(end_reason IN ('COMPLETED','PAUSED','FAILED','INTERRUPTED') OR end_reason IS NULL), total_prompts_planned INTEGER NOT NULL DEFAULT 0, total_prompts_executed INTEGER NOT NULL DEFAULT 0, prompts_passed INTEGER NOT NULL DEFAULT 0, prompts_retried INTEGER NOT NULL DEFAULT 0, prompts_failed INTEGER NOT NULL DEFAULT 0, total_tokens INTEGER NOT NULL DEFAULT 0, architecture_decisions TEXT DEFAULT '[]', maturity_stage TEXT CHECK(maturity_stage IN ('FOUNDATION','GROWTH','ENTERPRISE') OR maturity_stage IS NULL), first_pass_rate REAL, machine_id TEXT NOT NULL, created_at TEXT NOT NULL DEFAULT (datetime('now')));
