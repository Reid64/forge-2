- id: r1-005
  name: "Learning Engine Read Functions Part 2"
  description: |
    Working directory: C:\Users\manag\Documents\FORGE 2.0

    Implement four aggregate read functions in modules\ForgeLearning.psm1.

    Get-BestPromptTemplates:
    - Parameters: [string]$TaskType, [int]$MinSamples = 3, [string]$DatabasePath
    - Query: SELECT prompt_template_hash, AVG(first_pass_success) as avg_success, COUNT(*) as sample_count FROM prompt_scores WHERE task_type = $TaskType GROUP BY prompt_template_hash HAVING COUNT(*) >= $MinSamples ORDER BY avg_success DESC
    - Returns empty array if no matches

    Get-DecisionWeights:
    - Parameters: [string]$DecisionType, [int]$MinBuilds = 2, [string]$DatabasePath
    - Query: SELECT option_chosen, AVG(downstream_error_rate) as avg_error_rate, SUM(sample_size) as total_samples FROM decision_weights WHERE decision_type = $DecisionType GROUP BY option_chosen HAVING SUM(sample_size) >= $MinBuilds ORDER BY avg_error_rate ASC
    - Returns empty array if no matches

    Get-RelevantSkills:
    - Parameters: [string[]]$TechStack, [string]$DatabasePath
    - Returns skills where tech_stack_tags JSON intersects with provided tags, ordered by effectiveness_rate DESC
    - Returns empty array if no matches

    Get-PendingEvolutions:
    - Parameters: [string]$DatabasePath
    - Returns all rows where status = 'PENDING' ordered by confidence DESC
    - Returns empty array if no matches

    RULES: All functions must have typed param() blocks. All return empty arrays (not $null). Update Export-ModuleMember.

