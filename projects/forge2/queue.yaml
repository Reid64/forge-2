- id: r1-007
  name: "Error Fingerprinting & Fix Registration"
  description: |
    Working directory: C:\Users\manag\Documents\FORGE 2.0

    Implement four functions in modules\ForgeLearning.psm1.

    Get-ErrorFingerprint:
    - Parameters: [string]$ErrorCode, [string]$FilePath, [string]$ErrorMessage, [string[]]$TechStack
    - Concatenates: ErrorCode + GeneralizedPath + TemplatedMessage + SortedTechStack
    - Returns SHA-256 hex hash (64 characters)
    - Same error pattern in different files must produce same fingerprint

    ConvertTo-GeneralizedPath:
    - Replaces dynamic path segments: app/api/storms/route.ts -> app/api/*/route.ts
    - Replaces Next.js dynamic segments: app/[id]/page.tsx -> app/*/page.tsx
    - Replaces UUID-like segments, numeric IDs with *

    Register-Error:
    - Parameters: [string]$ErrorCode, [string]$FilePath, [string]$ErrorMessage, [string[]]$TechStack, [string]$DatabasePath
    - Computes fingerprint via Get-ErrorFingerprint
    - If fingerprint exists in fix_patterns: increments occurrence_count
    - If new: creates fix_patterns row via Save-ToForgeMemory

    Register-Fix:
