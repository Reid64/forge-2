project: forge-2
governance:
- BLUEPRINT.md
- STATE_OF_THE_BUILD.md
- SESSION_STATE.md
- SCHEMA_REGISTRY.md
- BEHAVIORAL_CONTRACTS.md
prompts:
  - id: scratch-promote-classification
    name: Path classification and scratch-write enforcement for shared_canonical paths
    prompt: "Read C:\\Users\\manag\\Documents\\forge-2\\src\\engine\\claude-runner.ts and src\\phases\\phase3-executor.ts in full to find where prompt text is assembled before being sent to the Claude Code CLI - the scratch-path rewrite must inject there. Read C:\\Users\\manag\\Documents\\FORGE\\library\\Tarritrix\\library-manifest.yaml as a real example of the queue/manifest schema. Add a path_class field to the file_exists gate schema in the queue YAML type definitions (src/types or wherever gates.file_exists.files is typed): unique_per_task (default, no special handling) or shared_canonical (matches a glob in an operator-configurable list, default seed docs/decisions/**, docs/audits/**, STATE_OF_THE_BUILD.md, SCHEMA_REGISTRY.md, BEHAVIORAL_CONTRACTS.md, AGENTS.md, BLUEPRINT.md, or any path also declared in the queue's governance: list). When a prompt's declared output includes a shared_canonical path, automatically prepend an instruction to the Build Agent invocation directing it to write to docs/_forge-scratch/{queue_id}/{prompt_id}/{run_timestamp}/{original_filename} instead of the real path - the prompt author must never have to remember this. The file_exists gate for that prompt must check the scratch path, not the canonical one, so the prompt's own pass/fail is unaffected. Implement full inline TypeScript, no pseudocode, no TODOs. Retrofit the shared_canonical classification onto STATE_OF_THE_BUILD.md and SCHEMA_REGISTRY.md specifically as the first real validation case. Run pnpm run build in C:\\Users\\manag\\Documents\\forge-2 and confirm 0 errors. Commit: git add -A; git commit -m 'feat(engine): path_class scratch-write enforcement for shared_canonical files - prevents concurrent-session collisions on governance docs'."
    gates:
    - type: compile

  - id: scratch-promote-gate-and-locks
    name: promote_scratch gate type and concurrent-session lock mechanism
    prompt: "Read the scratch-write enforcement just added in the previous commit (git log -1 --stat to see the exact files touched, then read them in full) before writing any new code - build on that pattern, do not duplicate it. Add a new gate type promote_scratch to the queue gate system, usable as the final gate on a queue or its own dedicated queue entry, accepting scratch_glob and canonical_mapping fields. Behavior: run git pull immediately before comparing/writing to the canonical path. If the canonical path doesn't exist yet, or exists but is byte-identical to the scratch content, copy directly. If the canonical path exists and differs, do not auto-merge - write both versions to a timestamped docs/_forge-scratch/_pending-review/ location and halt the queue with a clear operator-facing message identifying both file paths. On successful promotion: git add the canonical path only (never git add -A, per this project's existing standing rule against sweeping in unrelated dirty files), commit with a message identifying the source queue/prompt/scratch-timestamp, and git push immediately. Clean up the promoted scratch file after promotion. Separately, before any shared_canonical-path prompt begins execution, check for a lock file at docs/_forge-scratch/.locks/{canonical_path_hash}.lock containing queue_id, prompt_id, pid, acquired_at. If a lock exists and is younger than a configurable staleness threshold (default 30 minutes), the prompt should wait/retry rather than proceed. Release the lock when the scratch write completes, not when promotion completes. Implement full inline TypeScript, no pseudocode, no TODOs. Ensure the lock mechanism does not deadlock - a crashed session's stale lock must be automatically reclaimable after the staleness threshold. Run pnpm run build in C:\\Users\\manag\\Documents\\forge-2 and confirm 0 errors. Commit: git add -A; git commit -m 'feat(engine): promote_scratch gate and concurrent-session lock mechanism - completes scratch-then-promote pattern'."
    gates:
    - type: compile
