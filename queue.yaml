    prompt: "Read C:\\Users\\manag\\Documents\\FORGE\\forge.ps1 in full, specifically the Log function and every call site that prints prompt/gate/retry status. In C:\\Users\\manag\\Documents\\forge-2\\src\\phases\\phase3-executor.ts find renderProgress (or the equivalent console-output function) and rewrite it to match FORGE 1.0's output exactly, with no omissions: (1) project banner with === PROJECTNAME === on its own line, (2) PROMPT X OF Y on its own colored line, (3) PROMPT ID: value, (4) PROMPT NAME: value (never blank - pull from the queue entry's name field), (5) PHASE: value (never blank - pull from prompt_type or an explicit phase field, default to the prompt_type if no phase exists), (6) STARTED at timestamp, (7) Executing Build Agent... line, (8) for each Sentinel check: Running gate: name then PASS/FAIL with timestamp, (9) on gate failure: FAILED at timestamp - exhausted N retries or the specific failure reason, then Invoking Recovery Agent... line, (10) on retry: RETRY N at timestamp, (11) on final pass: PASSED at timestamp then PROMPT id : ALL GATES PASSED, on final fail: PROMPT id : FAILED after N retries. Use the same [yyyy-MM-dd HH:mm:ss] [LEVEL] timestamp format and the same color scheme already defined in FORGE 1.0's Log function (project name distinct color, PROMPT X OF Y distinct color, PASS green, WARN/RETRY yellow, FAIL red, timestamps subdued). Do not change any gate logic, any pass/fail decision, or any retry logic - this is output formatting only. Run pnpm run build in C:\\Users\\manag\\Documents\\forge-2 and confirm 0 errors. Commit: git add -A; git commit -m 'fix(executor): match FORGE 1.0 console output format exactly - project banner, prompt id/name/phase, gate timing, retry/recovery lines'."
